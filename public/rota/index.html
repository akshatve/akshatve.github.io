<style>

a{color:var(--blue)}

<body>
<div id="app"><div class="lock"><div class="spin" style="margin:60px auto"></div></div></div>
<script>
'use strict';
/* ───────────── basics ───────────── */
const S = { token: '', user: null, b: null, tab: 'today', offset: 0 };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get(k) { try { return localStorage.getItem('nvrota_' + k); } catch (e) { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem('nvrota_' + k) : localStorage.setItem('nvrota_' + k, v); } catch (e) { } } };
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const now = () => new Date(Date.now() + S.offset);
const today = () => ymd(now());
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const pd = s => { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 12); };
const addD = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); };
const monday = s => { const d = pd(s || today()); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
const dLabel = s => { const d = pd(s); return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
const hmin = m => { m = Math.max(0, Math.round(m || 0)); return Math.floor(m / 60) + 'h ' + pad(m % 60) + 'm'; };
const toMin = hm => { const m = /^(\d{1,2}):(\d{2})/.exec(hm || ''); return m ? (+m[1]) * 60 + (+m[2]) : 0; };
const rs = n => '₹' + Math.round(n || 0).toLocaleString('en-IN');
const initials = n => String(n).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const SHIFT = { M: 'Morning', E: 'Evening', OFF: 'Weekly off', LP: 'Leave (paid)', LU: 'Leave (unpaid)', HOL: 'Holiday', CUST: 'Custom' };
const SHORT = { M: 'M', E: 'E', OFF: 'Off', LP: 'L', LU: 'LU', HOL: 'Hol', CUST: '⏱' };
function phoneId() { let id = store.get('phone'); if (!id) { id = 'PH-' + Array.from(crypto.getRandomValues(new Uint8Array(9))).map(b => b.toString(16).padStart(2, '0')).join(''); store.set('phone', id); } return id; }

let toastT;
function toast(msg, err) { let t = $('.toast'); if (!t) { t = document.createElement('div'); document.body.appendChild(t); } t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), err ? 6500 : 3200); }
function busy(msg) { const b = document.createElement('div'); b.className = 'busy'; b.innerHTML = '<div class="spin"></div><div>' + esc(msg || 'Working…') + '</div>'; document.body.appendChild(b); return { done: () => b.remove(), set: m => { b.lastChild.textContent = m; } }; }
async function run(msg, fn) { const b = busy(msg); try { return await fn(b); } catch (e) { toast(e.message, true); throw e; } finally { b.done(); } }
function sheet(title, html, onClose) {
  const el = document.createElement('div'); el.className = 'sheet';
  el.innerHTML = '<div class="in"><div class="hd"><h2>' + esc(title) + '</h2><button class="x" aria-label="Close">×</button></div><div class="bd">' + html + '</div></div>';
  const close = () => { el.remove(); if (onClose) onClose(); };
  el.querySelector('.x').onclick = close; el.onclick = e => { if (e.target === el) close(); };
  document.body.appendChild(el); return { el: el, body: el.querySelector('.bd'), close: close };
}

/* ───────────── server ───────────── */
async function post(url, body) {
  const go = () => fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(r => r.json());
  let j;
  try { j = await go(); } catch (e) { await new Promise(r => setTimeout(r, 1500)); try { j = await go(); } catch (e2) { throw new Error('No internet connection – check Wi-Fi / mobile data and try again.'); } }
  if (!j || !j.ok) { const m = (j && j.e) || 'Server error'; if (/Signed out/.test(m)) { signOut(true); } throw new Error(m); }
  return j.r;
}
const inv = (action, data) => post(window.INV_API, { token: S.token, action: action, data: data || {} });
const call = (action, data) => post(window.ROTA_API, { token: S.token, action: action, data: data || {} });

/* ───────────── location + camera ───────────── */
function getPos(onProgress) {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('This phone cannot share its location.'));
    let best = null, done = false;
    const finish = () => { if (done) return; done = true; navigator.geolocation.clearWatch(w); clearTimeout(t); best ? res(best) : rej(new Error('Could not get your location. Turn on Location / GPS and try again.')); };
    const w = navigator.geolocation.watchPosition(p => {
      const c = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) };
      if (!best || c.acc < best.acc) best = c;
      if (onProgress) onProgress(best);
      if (best.acc <= 35) finish();
    }, e => {
      if (e.code === 1) { done = true; navigator.geolocation.clearWatch(w); clearTimeout(t); rej(new Error('Location permission is blocked. Allow Location for this app in phone Settings → Apps → Chrome (or Safari) → Location, then try again.')); }
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
    const t = setTimeout(finish, 15000);
  });
}
function haversine(a, b, c, d) { const R = 6371000, r = x => x * Math.PI / 180, dLat = r(c - a), dLng = r(d - b); const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(dLng / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
function nearestLoc(p) {
  let best = null; (S.b.locations || []).filter(l => l.lat != null).forEach(l => { const d = haversine(p.lat, p.lng, l.lat, l.lng); if (!best || d < best.d) best = { name: l.name, d: d, r: l.radius }; });
  return best;
}
const distTxt = d => d >= 1000 ? (d / 1000).toFixed(1) + ' km' : Math.round(d) + ' m';
/** Front-camera selfie → resized JPEG (base64) with the name and time printed on it. */
function selfie(title) {
  return new Promise((resolve, reject) => {
    const sh = sheet(title || 'Selfie', '<div class="cam"><video playsinline autoplay muted></video><div class="ring"></div></div>' +
      '<p class="small mute" style="text-align:center">Face in the circle, then tap the button.</p><button class="btn gold huge snap">📸 Take selfie</button>' +
      '<input type="file" accept="image/*" capture="user" style="display:none">', () => { stop(); if (!got) reject(new Error('Selfie cancelled.')); });
    let stream = null, got = false;
    const video = sh.el.querySelector('video'), file = sh.el.querySelector('input');
    const stop = () => { if (stream) stream.getTracks().forEach(t => t.stop()); };
    const finish = (src, w, h) => {
      const c = document.createElement('canvas'), W = 480, H = Math.round(W * h / w); c.width = W; c.height = H;
      const x = c.getContext('2d'); x.drawImage(src, 0, 0, W, H);
      x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, H - 46, W, 46); x.fillStyle = '#fff'; x.font = 'bold 17px sans-serif';
      const n = now(); x.fillText(S.user.name + '  ·  ' + dLabel(ymd(n)) + '  ' + pad(n.getHours()) + ':' + pad(n.getMinutes()), 12, H - 18);
      got = true; stop(); sh.el.remove(); resolve(c.toDataURL('image/jpeg', 0.62));
    };
    sh.el.querySelector('.snap').onclick = () => {
      if (stream && video.videoWidth) {
        const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight;
        const x = c.getContext('2d'); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(video, 0, 0);
        finish(c, c.width, c.height);
      } else file.click();
    };
    file.onchange = () => { const f = file.files[0]; if (!f) return; const img = new Image(); img.onload = () => finish(img, img.naturalWidth, img.naturalHeight); img.src = URL.createObjectURL(f); };
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 720 } }, audio: false })
        .then(s => { stream = s; video.srcObject = s; })
        .catch(() => { sh.el.querySelector('.cam').innerHTML = '<div style="color:#fff;padding:30px;text-align:center">Camera not allowed here – tap the button to use the phone camera.</div>'; });
    }
  });
}
function pickPhoto(cb) {
  const f = document.createElement('input'); f.type = 'file'; f.accept = 'image/*';
  f.onchange = () => { const file = f.files[0]; if (!file) return; const img = new Image(); img.onload = () => {
    const W = Math.min(1100, img.naturalWidth), H = Math.round(W * img.naturalHeight / img.naturalWidth), c = document.createElement('canvas'); c.width = W; c.height = H;
    c.getContext('2d').drawImage(img, 0, 0, W, H); cb(c.toDataURL('image/jpeg', 0.7)); }; img.src = URL.createObjectURL(file); };
  f.click();
}

/* ───────────── sign in (same people & PINs as the Nutvique app) ───────────── */
async function start() {
  S.token = store.get('token') || '';
  if (!S.token) { try { const t = localStorage.getItem('nvinv_token'); if (t) { S.token = t; S.borrowed = true; } } catch (e) { } }   // already signed in to the Nutvique app on this phone
  if (!S.token) return loginScreen();
  try { await boot(); } catch (e) { if (!S.token) return; $('#app').innerHTML = '<div class="lock"><h1>NUTVIQUE</h1><p class="warnbox bad">' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">Try again</button></div>'; }
}
function signOut(quiet) {
  let shared = S.borrowed; try { shared = shared || localStorage.getItem('nvinv_token') === S.token; } catch (e) { }
  if (S.token && !quiet && !shared) inv('logout').catch(() => { });   // never sign the billing app out from here

async function doPunch(type, reason, selfieData) {
  const label = { IN: 'Clock in', BO: 'Start break', BI: 'Back from break', OUT: 'Clock out' }[type];

  let pos;
  const b = busy('Finding your location…');
  try { pos = await getPos(p => { const n = nearestLoc(p); b.set('Finding your location… ±' + p.acc + ' m' + (n ? ' · ' + distTxt(n.d) + ' from ' + n.name : '')); }); }
  catch (e) { b.done(); return toast(e.message, true); }
  b.done();
  if (pos.acc > (S.b.maxAcc || 250)) return toast('GPS is not precise yet (±' + pos.acc + ' m). Step near the store entrance or a window and try again.', true);
  let pic = selfieData || '';
  if (S.b.selfie && !pic) { try { pic = await selfie(label + ' – selfie'); } catch (e) { return toast(e.message, true); } }
  let r;
  try { r = await run('Saving…', () => call('punch', { type: type, lat: pos.lat, lng: pos.lng, acc: pos.acc, selfie: pic, phone: phoneId(), reason: reason || '' })); }
  catch (e) { return; }
  if (r.needReason) {
    const n = r.near;
    const sh = sheet('You are not at a store', '<p class="warnbox">' + (n ? 'You are ' + distTxt(n.dist) + ' from ' + esc(n.name) + '.' : 'No store is near you.') + ' If you are working somewhere else (event, warehouse, delivery), write where and why. A manager has to approve it before it counts.</p>' +
      '<label class="f">Where are you and why?</label><textarea class="i" rows="3" id="rsn" placeholder="e.g. Event stall at ATS Bouquet"></textarea><br><br><button class="btn full" id="rgo">Send for approval</button>');
    sh.el.querySelector('#rgo').onclick = () => { const v = sh.el.querySelector('#rsn').value.trim(); if (v.length < 5) return toast('Write where you are.', true); sh.close(); doPunch(type, v, pic); };
    return;
  }
  S.b.day = r; if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
  toast('✓ ' + r.saved.label + ' at ' + r.saved.time + (r.saved.flags.length ? ' – ' + r.saved.flags.join(', ') : ''));
  go('today');
}

/* ───────────── TRIPS (staff) ───────────── */
let TRAIL = null;
function startTrail(trip) {
  if (TRAIL && TRAIL.id === trip.id) return;
  stopTrail();
  let pts = []; try { pts = JSON.parse(store.get('trail_' + trip.id) || '[]'); } catch (e) { }
  TRAIL = { id: trip.id, pts: pts, w: null };
  if (!navigator.geolocation) return;
  TRAIL.w = navigator.geolocation.watchPosition(p => {
    if (p.coords.accuracy > 80) return;
    const c = [p.coords.latitude, p.coords.longitude, Date.now()], last = TRAIL.pts[TRAIL.pts.length - 1];
    if (last && haversine(last[0], last[1], c[0], c[1]) < 60 && Date.now() - last[2] < 120000) return;
    TRAIL.pts.push(c); if (TRAIL.pts.length > 1500) TRAIL.pts.shift();
    store.set('trail_' + trip.id, JSON.stringify(TRAIL.pts));
    const k = $('#tkm'); if (k) k.textContent = trailKm(trip).toFixed(1);
  }, () => { }, { enableHighAccuracy: true, maximumAge: 15000 });
  try { if (navigator.wakeLock && !TRAIL.lock) navigator.wakeLock.request('screen').then(l => { if (TRAIL) TRAIL.lock = l; }).catch(() => { }); } catch (e) { }
}
function stopTrail() { if (TRAIL) { if (TRAIL.w != null) navigator.geolocation.clearWatch(TRAIL.w); try { TRAIL.lock && TRAIL.lock.release(); } catch (e) { } } TRAIL = null; }
function trailKm(trip) {
  const pts = [[trip.sLat, trip.sLng]].concat((TRAIL && TRAIL.pts) || []); let d = 0;
  for (let i = 1; i < pts.length; i++) { const s = haversine(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]); if (s < 5000) d += s; }
  return d / 1000;
}

  el.innerHTML = '<div class="card"><h2>Start a trip</h2><label class="f">Where to and why</label><input class="i" id="tp" placeholder="e.g. Stock from warehouse to Gulshan store">' +
    '<label class="f">Travelling by</label><div class="pills" id="tm">' + S.b.modes.map(x => '<button data-m="' + x.key + '"' + (x.key === mode ? ' class="on"' : '') + '>' + esc(x.label) + '</button>').join('') + '</div>' +
    '<p class="tiny mute" id="tmh"></p><button class="btn gold full" id="tgo">▶ Start trip</button></div>';
  const hint = () => { const x = S.b.modes.find(z => z.key === mode); $('#tmh').textContent = x.kind === 'km' ? 'Paid ' + rs(S.b.rates[mode === 'car' ? 'car' : 'bike']) + ' per km. Keep this app open on the way so the route is recorded.' : x.kind === 'fare' ? 'You will type the actual fare at the end' + (x.receipt ? ' and add the receipt screenshot.' : '.') : 'No money claimed.'; };
  el.querySelectorAll('#tm button').forEach(b => b.onclick = () => { mode = b.dataset.m; el.querySelectorAll('#tm button').forEach(x => x.classList.toggle('on', x === b)); hint(); });
  hint();
  $('#tgo').onclick = async () => {
    const purpose = $('#tp').value.trim(); if (purpose.length < 4) return toast('Write where you are going.', true);
    let pos; const b = busy('Finding your location…');
    try { pos = await getPos(p => b.set('Finding your location… ±' + p.acc + ' m')); } catch (e) { b.done(); return toast(e.message, true); }
    b.done();
    const r = await run('Starting…', () => call('tripStart', { purpose: purpose, mode: mode, lat: pos.lat, lng: pos.lng, acc: pos.acc }));
    store.set('lastMode', mode); S.b.day.trip = r.trip; startTrail(r.trip); toast('Trip started'); go('trips');
  };
}
function tripRunning(t) {
  const el = $('#tnow'), mins = Math.round((now() - new Date(t.start)) / 60000);
  el.innerHTML = '<div class="card clock"><div class="date">TRIP RUNNING · ' + esc(t.modeLabel) + '</div><div class="st" style="margin-top:4px">' + esc(t.purpose) + '</div>' +
    '<div class="sub">From ' + esc(t.startPlace) + ' · started ' + new Date(t.start).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) + ' (' + hmin(mins) + ' ago)</div>' +
    (t.kind === 'km' ? '<div class="time" style="font-size:34px;margin-top:8px"><span id="tkm">' + trailKm(t).toFixed(1) + '</span> km</div><div class="sub">recorded on this phone so far</div>' : '') + '</div>' +
    '<button class="btn bad huge" id="tend">🏁 End trip</button><div style="height:8px"></div><button class="btn ghost full sm" id="tcan">Cancel this trip (started by mistake)</button>';
  $('#tend').onclick = () => tripEndSheet(t);
  $('#tcan').onclick = async () => { if (!confirm('Cancel this trip? Nothing will be claimed.')) return; await run('Cancelling…', () => call('tripCancel', { id: t.id })); stopTrail(); store.set('trail_' + t.id, null); S.b.day.trip = null; go('trips'); };
}
async function tripEndSheet(t) {
  let pos; const b = busy('Finding your location…');
  try { pos = await getPos(p => b.set('Finding your location… ±' + p.acc + ' m')); } catch (e) { b.done(); return toast(e.message, true); }
  b.done();
  const straight = haversine(t.sLat, t.sLng, pos.lat, pos.lng) / 1000, trail = trailKm(t), est = Math.max(trail, straight * 1.3);
  let receipt = '';
  const sh = sheet('End trip', '<p class="small">' + esc(t.purpose) + ' · ' + esc(t.modeLabel) + '</p>' +
    (t.kind === 'km' ? '<div class="warnbox blue">Distance: about <b>' + est.toFixed(1) + ' km</b> (route ' + trail.toFixed(1) + ' km, straight line ' + straight.toFixed(1) + ' km). Claim ≈ <b>' + rs(est * S.b.rates[t.mode === 'car' ? 'car' : 'bike']) + '</b></div>' +
      '<label class="f">Km (change only if the route was not recorded – your manager sees the GPS figure)</label><input class="i" id="ekm" type="number" inputmode="decimal" step="0.1" value="' + est.toFixed(1) + '">' : '') +
    (t.kind === 'fare' ? '<label class="f">Fare you paid (₹)</label><input class="i" id="efare" type="number" inputmode="decimal" placeholder="Exact amount from the app / ticket">' +
      '<label class="f">Receipt screenshot' + (S.b.modes.find(x => x.key === t.mode).receipt ? ' (needed)' : ' (if you have one)') + '</label><button class="btn ghost full" id="erc">📎 Add screenshot / photo</button><div id="erp"></div>' : '') +
    '<label class="f">Note (optional)</label><input class="i" id="enote" placeholder="e.g. Carried 2 cartons"><br><br><button class="btn full gold" id="ego">Submit trip</button>');
  const rc = sh.el.querySelector('#erc');
  if (rc) rc.onclick = () => pickPhoto(d => { receipt = d; sh.el.querySelector('#erp').innerHTML = '<img src="' + d + '" style="max-width:100%;max-height:220px;border-radius:10px;margin-top:8px">'; });
  sh.el.querySelector('#ego').onclick = async () => {
    const data = { id: t.id, lat: pos.lat, lng: pos.lng, acc: pos.acc, trail: ((TRAIL && TRAIL.pts) || []).map(p => [p[0], p[1]]), note: sh.el.querySelector('#enote').value, receipt: receipt };
    if (t.kind === 'km') data.km = sh.el.querySelector('#ekm').value;
    if (t.kind === 'fare') data.fare = sh.el.querySelector('#efare').value;
    const r = await run('Submitting…', () => call('tripEnd', data));
    sh.close(); stopTrail(); store.set('trail_' + t.id, null); S.b.day.trip = null;
    toast('Trip submitted – ' + (r.trip.claimed ? rs(r.trip.claimed) + ' sent for approval' : 'no cost')); go('trips');
  };
}

/* ───────────── ROTA PLAN (managers) ───────────── */
async function viewPlan(m, week) {
  week = week || S.planWeek || monday(today());
  S.planWeek = week;
  m.innerHTML = '<div class="row" style="margin-bottom:10px"><button class="btn ghost sm" id="wp">‹</button><div class="grow" style="text-align:center"><b>Week of ' + esc(dLabel(week)) + '</b><div class="tiny mute" id="wst"></div></div><button class="btn ghost sm" id="wn">›</button></div><div id="pb"><div class="spin" style="margin:30px auto"></div></div>';
  $('#wp').onclick = () => viewPlan(m, addD(week, -7)); $('#wn').onclick = () => viewPlan(m, addD(week, 7));
  let r; try { r = await call('rotaGet', { week: week }); } catch (e) { $('#pb').innerHTML = '<p class="warnbox bad">' + esc(e.message) + '</p>'; return; }
  S.plan = { week: week, r: r, cells: JSON.parse(JSON.stringify(r.cells)), dirty: false };
  drawPlan();
}
function drawPlan() {
  const P = S.plan, r = P.r, cells = P.cells;
  $('#wst').innerHTML = (P.dirty ? '<span class="chip warn">Not saved</span> ' : '') + '<span class="chip ' + (r.status === 'Published' && !P.dirty ? 'ok' : r.status === 'Draft' ? 'warn' : '') + '">' + esc(r.status) + '</span>';
  const byLoc = {}; r.staff.forEach(s => (byLoc[s.loc || 'No location set'] = byLoc[s.loc || 'No location set'] || []).push(s));
  const head = '<tr><th class="nm"></th>' + r.days.map(d => '<th class="' + (d === today() ? 'today' : '') + '">' + DAYS[pd(d).getDay()] + '<br>' + pd(d).getDate() + '</th>').join('') + '</tr>';
  let body = '';
  Object.keys(byLoc).sort((a, b) => (a === 'Head Office') - (b === 'Head Office') || (a < b ? -1 : 1)).forEach(loc => {
    body += '<tr class="loc"><td colspan="8">' + esc(loc) + '</td></tr>';
    byLoc[loc].forEach(s => {
      body += '<tr><td class="nm">' + esc(s.name.split(' ')[0]) + ' <span class="tiny mute">' + esc(s.name.split(' ').slice(1).join(' ').slice(0, 1)) + '</span></td>' + r.days.map(d => {
        const c = cells[s.name + '|' + d];
        if (!c) return '<td class="c" data-k="' + esc(s.name + '|' + d) + '">+</td>';
        const away = c.loc && c.loc !== s.loc ? '<small>@' + esc(c.loc.split(' ')[0]) + '</small>' : c.shift === 'CUST' ? '<small>' + esc(c.start) + '</small>' : '';
        return '<td class="c ' + esc(c.shift) + '" data-k="' + esc(s.name + '|' + d) + '">' + esc(SHORT[c.shift]) + away + '</td>';
      }).join('') + '</tr>';
    });
    if (loc !== 'Head Office' && loc !== 'No location set') body += '<tr><td class="nm tiny mute">cover M/E</td>' + r.days.map(d => {
      const here = Object.keys(cells).filter(k => k.split('|')[1] === d && (cells[k].loc || '') === loc).map(k => cells[k].shift);
      const mm = here.filter(x => x === 'M').length, ee = here.filter(x => x === 'E').length, cu = here.filter(x => x === 'CUST').length;
      return '<td class="cov' + (here.length && ((!mm || !ee) && !cu) ? ' bad' : '') + '">' + (here.length ? mm + '/' + ee : '') + '</td>';
    }).join('') + '</tr>';
  });
  const warn = rotaWarnLocal();
  $('#pb').innerHTML = '<div class="card" style="padding:8px"><table class="grid">' + head + body + '</table>' +
    '<p class="tiny mute" style="margin:8px 4px 0"><span class="chip M">M</span> Morning ' + esc(r.shifts.M.start + '–' + r.shifts.M.end) + ' &nbsp; <span class="chip E">E</span> Evening ' + esc(r.shifts.E.start + '–' + r.shifts.E.end) + ' &nbsp; Off = weekly off (Tue–Thu only) · tap a box to change</p></div>' +
    (warn.length ? '<div class="warnbox">' + warn.map(esc).join('<br>') + '</div>' : (Object.keys(cells).length ? '<div class="warnbox ok">✓ Every store covered on both shifts, one weekly off each on Tue–Thu.</div>' : '')) +
    '<div class="row wrap" style="gap:8px"><button class="btn gold grow" id="pauto">✨ Auto-plan this week</button><button class="btn ghost grow" id="pcopy">Copy last week</button></div><div style="height:8px"></div>' +
    '<div class="row" style="gap:8px"><button class="btn ghost grow" id="psave">Save draft</button><button class="btn ok grow" id="ppub">✓ Publish to staff</button></div>' +
    '<p class="tiny mute">Auto-plan keeps the boxes you already changed by hand this week (clear them first for a fresh plan). Staff only see the rota after you publish.</p>';
  $('#pb').querySelectorAll('td.c').forEach(td => td.onclick = () => editCell(td.dataset.k));
  $('#pauto').onclick = async () => {
    const keep = {}; Object.keys(P.cells).forEach(k => { if (P.manual && P.manual[k]) keep[k] = P.cells[k]; });
    const a = await run('Planning…', () => call('rotaAuto', { week: P.week, keep: keep }));
    P.cells = a.cells; P.dirty = true; drawPlan(); toast('Plan ready – check it, then Publish');
  };
  $('#pcopy').onclick = async () => {
    const prev = await run('Loading last week…', () => call('rotaGet', { week: addD(P.week, -7) }));
    if (!Object.keys(prev.cells).length) return toast('Last week has no rota.', true);

function rotaWarnLocal() {
  const P = S.plan, r = P.r, w = [];
  r.staff.forEach(s => {
    const mine = r.days.map(d => P.cells[s.name + '|' + d]).filter(Boolean); if (!mine.length) return;
    const offs = r.days.filter(d => (P.cells[s.name + '|' + d] || {}).shift === 'OFF');
    if (mine.length < 7) w.push(s.name + ': ' + (7 - mine.length) + ' day(s) not planned.');
    if (!offs.length && !mine.some(c => ['LP', 'LU', 'HOL'].indexOf(c.shift) >= 0)) w.push(s.name + ': no weekly off.');
    if (offs.length > 1) w.push(s.name + ': ' + offs.length + ' weekly offs (one allowed).');
    offs.forEach(d => { const dw = pd(d).getDay(); if ([2, 3, 4].indexOf(dw) < 0) w.push(s.name + ': off on ' + DAYS[dw] + ' – only Tue/Wed/Thu.'); });
  });
  const locs = {}; r.staff.forEach(s => { if (s.loc && s.loc !== 'Head Office' && r.locations.some(l => l.name === s.loc && l.type === 'Store')) locs[s.loc] = 1; });
  Object.keys(locs).forEach(loc => r.days.forEach(d => {
    const here = Object.keys(P.cells).filter(k => k.split('|')[1] === d && (P.cells[k].loc || '') === loc).map(k => P.cells[k].shift);
    if (!here.length) return;
    ['M', 'E'].forEach(c => { if (here.indexOf(c) < 0 && here.indexOf('CUST') < 0) w.push(loc + ' ' + DAYS[pd(d).getDay()] + ': nobody on ' + SHIFT[c].toLowerCase() + '.'); });
  }));
  return w;
}

async function savePlan(publish) {
  const P = S.plan;
  const warn = rotaWarnLocal();
  if (publish && warn.length && !confirm('There are ' + warn.length + ' warning(s):\n\n' + warn.slice(0, 8).join('\n') + '\n\nPublish anyway?')) return;
  const r = await run(publish ? 'Publishing…' : 'Saving…', () => call('rotaSave', { week: P.week, cells: P.cells, publish: publish }));
  S.plan = { week: P.week, r: r, cells: JSON.parse(JSON.stringify(r.cells)), dirty: false };
  toast(publish ? '✓ Published – staff can see it now' : 'Draft saved'); drawPlan();
  if (S.b.day) refreshBoot().catch(() => { });
}

      '<h3 style="font-size:12px;color:var(--mute)">RULES</h3><div class="card">' + r.settings.map(x => '<label class="f">' + esc(x.k) + '</label><input class="i" data-k="' + esc(x.k) + '" value="' + esc(x.v) + '"' + (x.k === 'Attendance starts on' ? ' type="date"' : '') + '><div class="tiny mute">' + esc(x.note) + '</div>').join('') +
      '<br><button class="btn full" id="sgo">Save rules</button></div><a class="btn ghost full" target="_blank" href="' + esc(r.sheetUrl) + '">Open the Google Sheet</a>';
    sh.el.querySelectorAll('.person').forEach(p => p.onclick = () => editLoc(r.locations[+p.dataset.i], draw));
    sh.el.querySelector('#lnew').onclick = () => editLoc(null, draw);
    sh.el.querySelector('#sgo').onclick = async () => { const values = {}; sh.el.querySelectorAll('[data-k]').forEach(i => values[i.dataset.k] = i.value); const x = await run('Saving…', () => call('settingsSave', { values: values })); draw(x); toast('Saved'); };
  };
  draw(r);
}
function editLoc(l, redraw) {
  l = l || { name: '', type: 'Store', lat: null, lng: null, radius: 200, active: true, notes: '' };
  const sh = sheet(l.name || 'New location', '<label class="f">Name (use the same store name as the billing app)</label><input class="i" id="ln" value="' + esc(l.name) + '">' +
    '<label class="f">Type</label><select class="i" id="lt"><option' + (l.type === 'Store' ? ' selected' : '') + '>Store</option><option' + (l.type === 'Office' ? ' selected' : '') + '>Office</option></select>' +
    '<div class="row"><div class="grow"><label class="f">Latitude</label><input class="i" id="la" inputmode="decimal" value="' + (l.lat != null ? l.lat : '') + '"></div><div class="grow"><label class="f">Longitude</label><input class="i" id="lg" inputmode="decimal" value="' + (l.lng != null ? l.lng : '') + '"></div></div>' +
    '<button class="btn gold full" id="lme" style="margin-top:10px">📍 Use my position here</button><p class="tiny mute" id="lacc"></p>' +
    '<label class="f">Radius (m) – how far from this point staff may clock in</label><input class="i" id="lr" type="number" value="' + l.radius + '"><label class="f">Notes</label><input class="i" id="lno" value="' + esc(l.notes || '') + '">' +
    '<label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="lac"' + (l.active ? ' checked' : '') + '> Active</label>' +
    (l.lat != null ? '<p><a target="_blank" href="https://maps.google.com/?q=' + l.lat + ',' + l.lng + '">See on Google Maps</a></p>' : '') + '<br><button class="btn full" id="lgo">Save location</button>');
  sh.el.querySelector('#lme').onclick = async () => {
    const b = busy('Reading GPS…'); let p; try { p = await getPos(x => b.set('Reading GPS… ±' + x.acc + ' m')); } catch (e) { b.done(); return toast(e.message, true); } b.done();
    sh.el.querySelector('#la').value = p.lat.toFixed(6); sh.el.querySelector('#lg').value = p.lng.toFixed(6); sh.el.querySelector('#lacc').textContent = 'GPS accuracy ±' + p.acc + ' m' + (p.acc > 60 ? ' – try again near the entrance for a better fix' : ' ✓');
  };
  sh.el.querySelector('#lgo').onclick = async () => {
    const x = await run('Saving…', () => call('locSave', { oldName: l.name, name: sh.el.querySelector('#ln').value, type: sh.el.querySelector('#lt').value, lat: sh.el.querySelector('#la').value, lng: sh.el.querySelector('#lg').value,
      radius: sh.el.querySelector('#lr').value, notes: sh.el.querySelector('#lno').value, active: sh.el.querySelector('#lac').checked }));
    sh.close(); redraw(x); S.b.locations = x.locations.filter(z => z.active); toast('Saved');
  };
}

/* ───────────── start ───────────── */
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.b && S.tab === 'today') refreshBoot().then(() => go('today')).catch(() => { }); });
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
start();
</script>
