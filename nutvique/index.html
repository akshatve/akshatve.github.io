<body>
<div id="app"></div>
<div id="modals"></div>
<script>
'use strict';
/* ───────────── state ───────────── */
const S = { pin: '', token: '', user: null, role: '', products: [], bySku: {}, stock: {}, locations: [], settings: {}, categories: [], view: 'search',
  filter: 'all', q: '', drafts: 0, gs1Pending: 0, at: null, inv: null, invWarn: [], stockLoc: 'All', stockQ: '' };
const LOC_SHORT = { 'Central Warehouse': 'CW', 'Gulshan One29 Mall': 'Gulshan', 'City Galleria – Gaur City-2': 'Galleria', 'Central Market – Sector 120': 'Sec 120' };
const $ = (s, el) => (el || document).querySelector(s), $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const x = Number(String(v == null ? '' : v).replace(/[₹,\s]/g, '')); return isFinite(x) ? x : 0; };
const r2 = x => Math.round(num(x) * 100) / 100, r3 = x => Math.round(num(x) * 1000) / 1000;
const inr = (x, d) => (x === '' || x == null || isNaN(x)) ? '–' : '₹' + Number(x).toLocaleString('en-IN', { maximumFractionDigits: d == null ? 2 : d, minimumFractionDigits: 0 });
const qfmt = x => Number(r3(x)).toLocaleString('en-IN', { maximumFractionDigits: 3 });
const unitOf = p => (p && p.unit) || 'kg';
const store = { get(k) { try { return localStorage.getItem('nvinv_' + k); } catch (e) { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem('nvinv_' + k) : localStorage.setItem('nvinv_' + k, v); } catch (e) { } } };
const ymd = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const today = () => ymd(new Date());
const isOwner = () => !!(S.user && S.user.role === 'Owner');
const can = k => !!(S.user && (S.user.role === 'Owner' || (S.user.rights || []).indexOf(k) >= 0));
const IN_APP = !!window.NV_APP;   // true in the installed app (camera + Bluetooth work), false inside Google's page

/* ───────────── server ───────────── */
function call(action, data) {
  const body = { token: S.token || '', pin: S.token ? '' : (S.pin || ''), action: action, data: data || {} };
  const fail = m => {
    if (/Signed out/.test(m) && ['hello', 'login', 'loginNames', 'logout'].indexOf(action) < 0) { S.token = ''; store.set('token', null); S.user = null; setTimeout(lockScreen, 0); }
    return new Error(m);
  };
  if (window.NV_API) {
    const post = () => fetch(window.NV_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(r => r.json());
    return post().catch(() => new Promise(r => setTimeout(r, 1500)).then(post))           // one quiet retry for a network blip
      .catch(() => { throw new Error('No internet connection – check Wi-Fi / mobile data and try again.'); })
      .then(j => { if (!j || !j.ok) throw fail((j && j.e) || 'Server error'); return j.r; });
  }
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(fail((e && e.message || String(e)).replace(/^Error:\s*/, '').replace(/^Exception:\s*/, '')))).api(body);
  });
}
let toastT;
function toast(msg, err) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); document.body.appendChild(t); }
  t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), err ? 6000 : 3000);
}
function busy(msg) { const b = document.createElement('div'); b.className = 'busy'; b.innerHTML = '<span class="spin dk"></span><div>' + esc(msg || 'Working…') + '</div>'; document.body.appendChild(b); return () => b.remove(); }
async function run(msg, fn) { const done = busy(msg); try { return await fn(); } catch (e) { toast(e.message, true); throw e; } finally { done(); } }

/* ───────────── lock / login ───────────── */
async function start() {
  S.token = store.get('token') || '';
  const oldPin = store.get('pin');
  try {
    if (!S.token && oldPin) {                         // owner signed in on this phone before personal PINs: switch to a session
      try { const r = await call('login', { name: 'Owner', pin: oldPin }); S.token = r.token; store.set('token', S.token); } catch (e) { }
      store.set('pin', null);
    }
    const h = await call('hello');
    if (h.needOwnerPin) return firstPin();
    if (h.user) { S.user = h.user; return h.user.mustChange ? forcePinChange() : boot(); }
    lockScreen();
  } catch (e) { $('#app').innerHTML = '<div class="lock"><h1>NUTVIQUE</h1><p class="warnbox bad">' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">Try again</button></div>'; }
}
function pinPad(title, sub, onDone, extra) {
  let v = '';
  $('#app').innerHTML = '<div class="lock"><h1>NUTVIQUE</h1><div class="mute small" style="letter-spacing:.2em">INVENTORY · BILLING</div><h3 style="margin-top:28px">' + esc(title) + '</h3><div class="mute small">' + esc(sub || '') + '</div>' +
    '<div class="dots" id="dots"></div><div class="pad">' + [1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, '✓'].map(k => '<button data-k="' + k + '">' + k + '</button>').join('') + '</div>' + (extra || '') + '</div>';
  const draw = () => { $('#dots').innerHTML = Array.from({ length: Math.max(4, v.length) }, (_, i) => '<i class="' + (i < v.length ? 'on' : '') + '"></i>').join(''); };
  draw();
  const press = k => { if (k === '⌫') v = v.slice(0, -1); else if (k === '✓') { if (v.length >= 4) { const x = v; v = ''; draw(); onDone(x); } return; } else if (v.length < 8) v += k; draw(); };
  $$('.pad button').forEach(b => b.onclick = () => press(b.dataset.k));
  document.onkeydown = e => { if (!$('.pad')) return; if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('⌫'); else if (e.key === 'Enter') press('✓'); };
}
/* Sign in: pick your name, then your own PIN. The phone remembers the last name. */
async function lockScreen(pickName) {
  document.onkeydown = null;
  const last = store.get('lastName');
  if (last && !pickName) return pinFor(last);
  $('#app').innerHTML = '<div class="lock"><h1>NUTVIQUE</h1><div class="mute small" style="letter-spacing:.2em">INVENTORY · BILLING</div><h3 style="margin-top:24px">Who is signing in?</h3><div id="names"><div class="empty"><span class="spin dk"></span></div></div></div>';
  let r; try { r = await call('loginNames'); } catch (e) { $('#names').innerHTML = '<div class="warnbox bad">' + esc(e.message) + '</div><button class="btn" onclick="lockScreen(true)">Try again</button>'; return; }
  const names = r.names.slice().sort((a, b) => a.name.localeCompare(b.name));
  $('#names').innerHTML = '<div class="nlist">' + names.map(n => '<button data-n="' + esc(n.name) + '"><b>' + esc(n.name) + '</b><span>' + esc(n.role + (n.home ? ' · ' + (LOC_SHORT[n.home] || n.home) : '')) + '</span></button>').join('') +
    (r.owner ? '<button data-n="Owner" class="own"><b>Owner</b><span>Head office</span></button>' : '') + '</div>' +
    '<div class="tiny mute" style="margin-top:12px">Your name is not here? Ask head office to add you.</div>';
  $$('#names [data-n]').forEach(b => b.onclick = () => pinFor(b.dataset.n));
}
function pinFor(name) {
  pinPad(name === 'Owner' ? 'Owner' : 'Hi ' + name.split(' ')[0], 'Enter your PIN', async pin => {
    try {
      const r = await run('Signing in…', () => call('login', { name: name, pin: pin }));
      S.token = r.token; S.user = r.user; store.set('token', S.token); store.set('lastName', name);
      if (r.user.mustChange) return forcePinChange(pin);
      boot();
    } catch (e) { pinFor(name); }
  }, '<button class="btn ghost sm" style="margin-top:16px" onclick="store.set(\'lastName\',null);lockScreen(true)">Not ' + esc(name.split(' ')[0]) + '? Pick your name</button>');
}
/* First sign-in with the PIN from head office: choose your own (only you know it). */
function forcePinChange(oldPin) {
  const ask = () => pinPad('Choose your own PIN', '4–6 digits that only you know. Head office cannot see it.', p1 => {
    pinPad('Type the new PIN again', '', async p2 => {

function fileToBase64(f) {
  return new Promise((res, rej) => {
    if (/^image\//.test(f.type) && !/gif|svg/.test(f.type)) {
      const img = new Image(), url = URL.createObjectURL(f);
      img.onload = () => {
        const k = Math.min(1, 2200 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); res({ base64: c.toDataURL('image/jpeg', 0.88).split(',')[1], mime: 'image/jpeg' });
      };
      img.onerror = () => rej(new Error('Could not open that photo.')); img.src = url;
    } else {
      if (f.size > 15 * 1024 * 1024) return rej(new Error('File is larger than 15 MB.'));
      const fr = new FileReader(); fr.onload = () => res({ base64: String(fr.result).split(',')[1], mime: f.type || 'application/pdf' }); fr.onerror = () => rej(new Error('Could not read the file.')); fr.readAsDataURL(f);
    }
  });
}
async function uploadInvoice(f) {
  try {
    const b = await fileToBase64(f);
    const r = await run('Reading the invoice… (15–40 seconds)', () => call('readInvoice', { fileName: f.name, mime: b.mime, base64: b.base64 }));
    S.inv = r.draft; S.invWarn = r.warnings || []; S.drafts++; renderNav();
    S.inv.lines.forEach(l => primeLine(l));
    drawReview(); toast('Invoice read – check each line');
  } catch (e) { if (!$('.toast.err')) toast(e.message, true); }
}
function addLine() { const d = S.inv; d.lines.push({ no: d.lines.length + 1, desc: '', hsn: '', qty: 0, unit: 'KGS', rate: 0, amount: 0, gstPct: 5, alloc: [], how: 'new', candidates: [], newItem: { name: 'Nutvique ', short: '', cat: '', pack: 'Loose', net: '', netUnit: 'g' } }); }
/** Fill selling/MRP of each allocation with the product's current prices, and suggested prices for new items. */
function primeLine(l) {
  (l.alloc || []).forEach(a => { const p = S.bySku[a.sku]; if (p) { if (a.sell == null) a.sell = p.sell || ''; if (a.mrp == null) a.mrp = p.mrp || ''; } });
}
/* landed cost: same formula as Code.gs → landed_() */
function landed(d) {
  const charges = (d.charges || []).reduce((a, c) => a + num(c.amount), 0);
  const byQty = S.settings.spread === 'Quantity', withGst = S.settings.costGst;
  const base = d.lines.reduce((a, l) => a + (byQty ? num(l.qty) : num(l.amount)), 0) || 1;
  return d.lines.map(l => { const share = charges * (byQty ? num(l.qty) : num(l.amount)) / base; return { share: share, total: num(l.amount) + share + (withGst ? num(l.amount) * num(l.gstPct) / 100 : 0) }; });
}
function suggestSell(cost) { const k = S.settings.round || 10; return cost ? Math.ceil(cost * S.settings.markup / k) * k : ''; }
function suggestMrp(sell) { return sell ? Math.round(num(sell) * S.settings.mrpX) : ''; }
function checks(d) {
  const w = (S.invWarn || []).filter(x => /DUPLICATE|NIGHT CLOSING/.test(x));
  const sumAmt = d.lines.reduce((a, l) => a + num(l.amount), 0), ch = (d.charges || []).reduce((a, c) => a + num(c.amount), 0);
  d.lines.forEach(l => { if (Math.abs(num(l.qty) * num(l.rate) - num(l.amount)) > Math.max(1, num(l.amount) * 0.002)) w.push('Line ' + l.no + ': qty × rate = ' + inr(num(l.qty) * num(l.rate)) + ' but amount is ' + inr(l.amount) + '.'); });
  if (num(d.taxable) && Math.abs(sumAmt - num(d.taxable)) > 1) w.push('Lines add up to ' + inr(sumAmt) + ' but the invoice taxable value is ' + inr(d.taxable) + '.');
  const calc = sumAmt + num(d.gst) + ch + num(d.roundOff);
  if (num(d.total) && Math.abs(calc - num(d.total)) > 1) w.push('Taxable + GST + charges + round off = ' + inr(calc) + ' but the invoice total is ' + inr(d.total) + '.');
  return w;
}

function reviewStatus(d, lc) {
  let qty = 0, value = 0, todo = 0, newCount = 0, lines = 0;
  d.lines.forEach((l, i) => {
    if (l.skip) return; lines++;
    value += lc[i].total; qty += num(l.qty);
    if (l.how === 'new') { if (l.create) newCount++; else todo++; }
    else { const a = (l.alloc || []).filter(x => x.sku); const s = a.reduce((t, x) => t + num(x.qty), 0); if (!a.length || s <= 0) todo++; }
  });
  return { qty, value, todo, newCount, lines };
}

/* Import a QueueBuster sales export or a stock count sheet (xlsx / csv) */
function loadXlsx() { return window.XLSX ? Promise.resolve() : new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = () => rej(new Error('Could not load the spreadsheet reader.')); document.head.appendChild(s); }); }
function importSheet() {
  const m = modal('Import sales export / stock count file', '<div class="grid2">' + fld('File type', '<select class="i" id="m_kind"><option value="sale">Sales export (QueueBuster) – stock goes out</option><option value="count">Stock count sheet – set quantities</option></select>', 2) +
    fld('Store / location', '<select class="i" id="m_loc">' + S.locations.map(l => '<option>' + esc(l) + '</option>').join('') + '</select>') + fld('Date (if the file has none)', '<input class="i" type="date" id="m_date" value="' + today() + '">') +
    fld('File (.xlsx or .csv)', '<input class="i" type="file" id="m_file" accept=".xlsx,.xls,.csv">', 2) + '</div><div id="m_map"></div>');
  let table = null, fileName = '';
  $('#m_file', m).onchange = async e => {
    const f = e.target.files[0]; if (!f) return; fileName = f.name;
    try { await loadXlsx(); const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' }); const ws = wb.Sheets[wb.SheetNames[0]]; const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
      const hi = aoa.findIndex(r => r.filter(x => String(x).trim()).length >= 2); table = { head: aoa[hi].map(String), rows: aoa.slice(hi + 1).filter(r => r.some(x => String(x).trim())) }; drawMap(); }
    catch (err) { toast(err.message, true); }
  };
  const guess = (re) => table.head.findIndex(h => re.test(h));
  function drawMap() {
    const opts = sel => '<option value="-1">–</option>' + table.head.map((h, i) => '<option value="' + i + '"' + (i === sel ? ' selected' : '') + '>' + esc(h) + '</option>').join('');
    const gb = guess(/barcode|gtin|ean/i), gs = guess(/^sku|item code|product code/i), gn = guess(/product name|item name|^product$|^item$|name/i), gq = guess(/qty|quantity|sold|count/i), gd = guess(/date/i);
    $('#m_map', m).innerHTML = '<div class="grid2" style="margin-top:12px">' + fld('Barcode column', '<select class="i" id="c_b">' + opts(gb) + '</select>') + fld('SKU column', '<select class="i" id="c_s">' + opts(gs) + '</select>') +
      fld('Product name column', '<select class="i" id="c_n">' + opts(gn) + '</select>') + fld('Quantity column', '<select class="i" id="c_q">' + opts(gq) + '</select>') + fld('Date column (optional)', '<select class="i" id="c_d">' + opts(gd) + '</select>') + '</div><div id="m_prev"></div>';
    $$('#m_map select', m).forEach(s => s.onchange = prev); prev();
  }
  function findP(row) {
    const c = id => { const i = +$('#' + id, m).value; return i >= 0 ? String(row[i]).trim() : ''; };
    const b = c('c_b'), s = c('c_s').toUpperCase(), n = c('c_n');
    return S.products.find(p => b && p.gtin === b.replace(/\.0$/, '')) || S.products.find(p => s && p.sku === s) || S.products.find(p => n && p.name.toUpperCase() === n.toUpperCase()) ||
      S.products.find(p => n && p.name.toUpperCase().replace(/^NUTVIQUE\s+/, '') === n.toUpperCase().replace(/^NUTVIQUE\s+/, '')) || null;
  }
  function prev() {
    const qi = +$('#c_q', m).value, di = +$('#c_d', m).value;
    const out = table.rows.map(r => { const p = findP(r); let d = di >= 0 ? r[di] : ''; if (typeof d === 'number') d = ymd(new Date(Math.round((d - 25569) * 864e5))); else if (d) { const x = new Date(d); d = isNaN(x) ? '' : ymd(x); } return { r: r, p: p, qty: qi >= 0 ? num(r[qi]) : 0, date: d }; }).filter(x => x.qty);
    const ok = out.filter(x => x.p), miss = out.filter(x => !x.p);
    const agg = {}; ok.forEach(x => { const k = x.p.sku + '|' + (x.date || ''); agg[k] = agg[k] || { sku: x.p.sku, qty: 0, date: x.date }; agg[k].qty = r3(agg[k].qty + x.qty); });
    const lines = Object.values(agg);
    $('#m_prev', m).innerHTML = '<div class="' + (miss.length ? 'warnbox' : 'okbox') + '" style="margin-top:12px">' + ok.length + ' row(s) matched to ' + lines.length + ' product line(s)' + (miss.length ? ' · ' + miss.length + ' not matched (skipped): ' + esc(miss.slice(0, 6).map(x => x.r.join(' ').slice(0, 40)).join(' | ')) + (miss.length > 6 ? '…' : '') : '') + '</div>' +
      '<button class="btn block" id="m_go"' + (lines.length ? '' : ' disabled') + '>Import ' + lines.length + ' line(s)</button>';
    $('#m_go', m).onclick = async () => {
      const kind = $('#m_kind', m).value;
      const r = await run('Importing…', () => call('importMovements', { kind: kind, location: $('#m_loc', m).value, date: $('#m_date', m).value, file: fileName, lines: lines }));
      m.close(); await refresh(true); toast(r.rows + ' row(s) imported');
    };
  }
}

async function viewGs1() {
  $('#view').innerHTML = '<div class="row" style="margin-bottom:8px"><h2 class="grow" style="margin:0">GS1 & QueueBuster</h2><button class="btn sm" onclick="newProductSheet()">+ New product</button></div><div id="gl"><div class="empty"><span class="spin dk"></span></div></div>';
  const r = await call('gs1Queue');
  S.gs1Pending = r.items.length + (r.qb || []).length; renderNav();
  const qbh = (r.qb || []).length ? '<div class="card"><h3>QueueBuster needs updating (' + r.qb.length + ')</h3><div class="small mute">Changed in this app – already live on every phone. Download the file and upload it in QueueBuster (Products → import / bulk upload) so the POS has the same prices.</div>' +
    r.qb.map(p => '<div class="row" style="padding:8px 0;border-bottom:1px solid #efece4;flex-wrap:nowrap"><input type="checkbox" class="qk" value="' + esc(p.sku) + '" checked style="width:20px;height:20px"><div class="grow"><b>' + esc(p.name) + '</b><div class="tiny mute">' + esc(p.qbWhat) + ' · ' + esc(p.qbAt) + ' · now ' + inr(p.sell, 0) + ' / MRP ' + inr(p.mrp, 0) + (p.gtin ? '' : ' · <span class="neg">no barcode</span>') + '</div></div></div>').join('') +
    '<div class="row" style="margin-top:10px"><button class="btn" id="dqu">Download QueueBuster update file</button><button class="btn sm ghost" id="dqx">Done without file</button></div></div>' : '';
  const bindQb = () => {
    if (!$('#dqu')) return;
    const qs = () => $$('.qk').filter(c => c.checked).map(c => c.value);
    $('#dqu').onclick = async () => { const s = qs(); if (!s.length) return; await downloadExport('qb', s); viewGs1(); };
    $('#dqx').onclick = async () => { const s = qs(); if (!s.length || !confirm('Remove the ticked products from this list (you updated QueueBuster by hand)?')) return; await run('Saving…', () => call('qbDone', { skus: s })); viewGs1(); };
  };
  if (!r.items.length) { $('#gl').innerHTML = qbh + '<div class="empty">Every product is registered on GS1. New products appear here.</div>'; bindQb(); return; }
  $('#gl').innerHTML = qbh + (r.gs1Template && r.qbTemplate ? '' : '<div class="warnbox">Upload your blank DataKart and QueueBuster templates once in More → Settings, so the files match them exactly. Until then a built-in layout with the same columns is used.</div>') +
    '<div class="card" style="padding:6px 12px"><label class="row small" style="padding:8px 0;border-bottom:1px solid var(--line)"><input type="checkbox" id="all" checked style="width:20px;height:20px"> Tick all (' + r.items.length + ')</label>' +
    r.items.map(p => '<div class="row" style="align-items:flex-start;padding:10px 0;border-bottom:1px solid #efece4;flex-wrap:nowrap"><input type="checkbox" class="ck" value="' + esc(p.sku) + '" checked style="width:20px;height:20px;margin-top:2px">' +
      '<div class="grow"><b>' + esc(p.name) + '</b> <span class="pill ' + (p.gs1 === 'To upload' ? 'p-new' : 'p-warn') + '">' + esc(p.gs1) + '</span>' +
      '<div class="small" style="margin-top:3px">GTIN <b>' + esc(p.gtin) + '</b> · ' + inr(p.sell, 0) + ' / MRP ' + inr(p.mrp, 0) + '</div>' +
      '<div class="tiny mute">' + esc(p.sku) + ' · ' + esc(p.cat || 'no category!') + ' · HSN ' + esc(p.hsn) + (p.seller ? ' · seller: ' + esc(p.seller) : '') + '</div></div>' +
      '<button class="btn sm ghost" data-g="' + esc(p.sku) + '">GTIN…</button></div>').join('') + '</div>' +
    '<div class="row"><button class="btn" id="dg">1. Download GS1 DataKart file</button><button class="btn ghost" id="dq">2. Download QueueBuster file</button><button class="btn gold" id="mr">3. Mark ticked as registered</button></div>' +
    '<div class="small mute" style="margin-top:10px">Upload file 1 on DataKart and file 2 on QueueBuster. If DataKart gives a product a different GTIN, use “GTIN…” on that row before step 3 (and before uploading to QueueBuster).</div>';
  bindQb();
  const sel = () => $$('.ck').filter(c => c.checked).map(c => c.value);
  $('#all').onchange = e => $$('.ck').forEach(c => c.checked = e.target.checked);
  $('#dg').onclick = () => downloadExport('gs1', sel()); $('#dq').onclick = () => downloadExport('qb', sel());
  $('#mr').onclick = async () => { const s = sel(); if (!s.length) return; await run('Saving…', () => call('markGs1', { skus: s, status: 'Registered' })); await refresh(true); viewGs1(); toast('Marked registered'); };
  $$('[data-g]').forEach(b => b.onclick = async () => {
    const p = r.items.find(x => x.sku === b.dataset.g);
    const g = prompt('GTIN given by DataKart for ' + p.name + ' (13 digits). Current: ' + p.gtin, p.gtin);
    if (!g || g === p.gtin) return;
    await run('Saving…', () => call('markGs1', { skus: [p.sku], status: 'Uploaded', gtin: g.trim() })); await refresh(true); viewGs1();
  });
}
function newProductSheet() {
  const c = { name: 'Nutvique ', short: '', cat: '', pack: 'Loose', net: '', netUnit: 'g', hsn: '', gst: 5, sell: '', mrp: '', cost: '', seller: '', supplier: '' };
  const m = modal('New product', '<div class="grid2">' + fld('Nutvique name', '<input class="i" id="n_name" value="Nutvique ">', 2) + fld('Seller name (as on supplier invoice)', '<input class="i" id="n_seller">') + fld('Supplier', '<input class="i" id="n_sup">') +
    fld('Short description (under 40)', '<input class="i" id="n_short" maxlength="40">') + fld('Category', catSelect('n_cat', '')) +
    fld('Sold as', '<select class="i" id="n_pack"><option value="Loose">Loose (per kg)</option><option value="Packed">Packed (per piece)</option></select>') + fld('Net content (packed)', '<div class="row" style="flex-wrap:nowrap"><input class="i num" id="n_net"><select class="i" id="n_nu" style="width:80px"><option>g</option><option>kg</option><option>pc</option></select></div>') +
    fld('Cost ₹ (landed)', '<input class="i num" id="n_cost" inputmode="decimal">') + fld('HSN (blank = auto)', '<input class="i" id="n_hsn">') +
    fld('Selling ₹', '<input class="i num" id="n_sell" inputmode="decimal">') + fld('MRP ₹', '<input class="i num" id="n_mrp" inputmode="decimal">') + '</div>' +
    '<div id="n_pv" class="small mute" style="margin-top:8px"></div><div class="row" style="margin-top:12px"><button class="btn gold" id="n_mk">Suggest prices from cost</button><div class="grow"></div><button class="btn" id="n_go">Create & issue GTIN</button></div>');
  const g = id => $('#' + id, m).value;
  const pv = async () => { try { const r = await call('previewNew', { items: [{ name: g('n_name'), cat: g('n_cat'), pack: g('n_pack'), net: g('n_net'), netUnit: g('n_nu'), seller: g('n_seller'), hsn: g('n_hsn') }] });
    $('#n_pv', m).textContent = 'Will get SKU ' + r.items[0].sku + ' · GTIN ' + r.gtins[0] + ' · HSN ' + (r.items[0].hsn || '?') + (r.items[0].hsnFrom ? ' (' + r.items[0].hsnFrom + ')' : '') + ' · GST ' + r.items[0].gst + '%'; } catch (e) { } };
  ['n_name', 'n_cat', 'n_pack', 'n_net', 'n_nu', 'n_hsn', 'n_seller'].forEach(id => $('#' + id, m).onchange = pv);
  $('#n_sell', m).onchange = () => { $('#n_mrp', m).value = suggestMrp(g('n_sell')); };
  $('#n_mk', m).onclick = () => { const s = suggestSell(num(g('n_cost'))); $('#n_sell', m).value = s; $('#n_mrp', m).value = suggestMrp(s); };
  $('#n_go', m).onclick = async () => {
    const it = { name: g('n_name'), seller: g('n_seller'), supplier: g('n_sup'), short: g('n_short'), cat: g('n_cat'), pack: g('n_pack'), net: g('n_net'), netUnit: g('n_nu'), cost: g('n_cost'), hsn: g('n_hsn'), sell: g('n_sell'), mrp: g('n_mrp') };
    if (!it.cat) return toast('Pick the category.', true);
    const r = await run('Creating…', () => call('createProduct', { items: [it] }));
    m.close(); await refresh(true); toast('Created ' + r.created[0].name + ' · GTIN ' + r.created[0].gtin); if (S.view === 'gs1') viewGs1();
  };
}

/* ───────────── PEOPLE (owner, or anyone given "Manage people") ───────────── */
async function peopleScreen() {
  const m = modal('People, PINs and rights', '<div id="pp_b"><div class="empty"><span class="spin dk"></span></div></div>', { wide: true });
  let D;
  const draw = () => {
    const act = D.users.filter(u => u.active), off = D.users.filter(u => !u.active);
    const row = u => '<div class="li" data-u="' + esc(u.name) + '"><div class="grow"><b>' + esc(u.name) + '</b> <span class="pill ' + (u.role === 'Manager' ? 'p-ok' : 'p-mute') + '">' + esc(u.role) + '</span>' +
      (u.initialPin ? ' <span class="pill p-new">PIN to hand over: ' + esc(u.initialPin) + '</span>' : '') +
      (!u.home && u.rights.indexOf('allStores') < 0 ? ' <span class="pill p-warn">no store set</span>' : '') +
      '<div class="tiny mute">' + esc([u.home ? (LOC_SHORT[u.home] || u.home) : (u.rights.indexOf('allStores') >= 0 ? 'All stores' : ''), u.rights.length + ' right' + (u.rights.length === 1 ? '' : 's'), u.lastLogin ? 'last sign-in ' + new Date(u.lastLogin).toLocaleDateString('en-IN') : 'not signed in yet'].filter(Boolean).join(' · ')) + '</div></div><span class="mute">›</span></div>';
    $('#pp_b', m).innerHTML = '<div class="small mute">Each person signs in with their own name + PIN. A new person gets a PIN from head office (shown here in gold until they choose their own on first sign-in).</div>' +
      '<div class="card" style="margin-top:10px;padding:4px 12px">' + (act.map(row).join('') || '<div class="empty small">No one yet.</div>') + '</div>' +
      (off.length ? '<div class="small mute">Not active (cannot sign in)</div><div class="card" style="padding:4px 12px;opacity:.7">' + off.map(row).join('') + '</div>' : '') +
      '<button class="btn" id="pp_add">+ Add person</button>';
    $$('[data-u]', m).forEach(li => li.onclick = () => editPerson(D.users.find(u => u.name === li.dataset.u)));
    $('#pp_add', m).onclick = () => editPerson(null);
  };
  const editPerson = u => {
    const isNew = !u; u = u || { name: '', role: 'Staff', active: true, rights: ['bill', 'stockView', 'events', 'transfer', 'checkTransfer'], home: '', notes: '' };
    const e = modal(isNew ? 'Add person' : u.name, '<div class="grid2">' + fld('Name', '<input class="i" id="pe_n" value="' + esc(u.name) + '">') +
      fld('Role', '<select class="i" id="pe_r"><option' + (u.role !== 'Manager' ? ' selected' : '') + '>Staff</option><option' + (u.role === 'Manager' ? ' selected' : '') + '>Manager</option></select>') +
      fld('Home store', '<select class="i" id="pe_h"><option value="">– Head office / all –</option>' + D.stores.map(x => '<option' + (x === u.home ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select>') +
      fld('Status', '<select class="i" id="pe_a"><option value="Yes"' + (u.active ? ' selected' : '') + '>Active – can sign in</option><option value="No"' + (!u.active ? ' selected' : '') + '>Left / blocked</option></select>') + '</div>' +
      '<h3 style="margin:14px 0 4px">Rights</h3><div class="row" style="margin-bottom:6px"><button class="btn sm ghost" id="pe_ps">Staff set</button><button class="btn sm ghost" id="pe_pm">Manager set</button><button class="btn sm ghost" id="pe_pn">None</button></div>' +
      D.rights.map(r => '<label class="chk"><input type="checkbox" class="rk" value="' + r.key + '"' + (u.rights.indexOf(r.key) >= 0 ? ' checked' : '') + (can(r.key) ? '' : ' disabled') + '>' + esc(r.label) + '</label>').join('') +
      fld('Notes', '<input class="i" id="pe_no" value="' + esc(u.notes || '') + '">') +
      '<div class="row" style="margin-top:14px">' + (isNew ? '' : '<button class="btn ghost sm" id="pe_pin">Reset PIN</button>') + '<div class="grow"></div><button class="btn" id="pe_go">' + (isNew ? 'Add & make PIN' : 'Save') + '</button></div>');
    const preset = keys => $$('.rk', e).forEach(c => { if (!c.disabled) c.checked = keys.indexOf(c.value) >= 0; });
    $('#pe_ps', e).onclick = () => preset(['bill', 'stockView', 'events', 'transfer', 'checkTransfer']);
    $('#pe_pm', e).onclick = () => preset(['bill', 'disc10', 'otherItem', 'events', 'sales', 'stockView', 'transfer', 'checkTransfer', 'customers']);
    $('#pe_pn', e).onclick = () => preset([]);
    $('#pe_r', e).onchange = ev => preset(ev.target.value === 'Manager' ? ['bill', 'disc10', 'otherItem', 'events', 'sales', 'stockView', 'transfer', 'checkTransfer', 'customers'] : ['bill', 'stockView', 'events', 'transfer', 'checkTransfer']);
    $('#pe_go', e).onclick = async () => {
      const d = { name: isNew ? '' : u.name, newName: $('#pe_n', e).value.trim(), role: $('#pe_r', e).value, home: $('#pe_h', e).value, active: $('#pe_a', e).value,
        notes: $('#pe_no', e).value, rights: $$('.rk', e).filter(c => c.checked).map(c => c.value) };
      if (!d.newName) return toast('Type the name', true);
      const r = await run('Saving…', () => call('saveUser', d)).catch(() => null);
      if (!r) return;
      D = r; e.close(); draw();
      if (r.pin) showPin(d.newName, r.pin); else toast('Saved');
    };
    if ($('#pe_pin', e)) $('#pe_pin', e).onclick = async ev => {
      if (!confirmTwice(ev.target)) return;
      const r = await run('Making a new PIN…', () => call('resetPin', { name: u.name })).catch(() => null);
      if (r) { D = r; e.close(); draw(); showPin(r.pinFor, r.pin); }
    };
  };
  const showPin = (name, pin) => modal('PIN for ' + name, '<div class="bigp"><div><span>Give this PIN to ' + esc(name.split(' ')[0]) + '</span><b style="font-size:34px;letter-spacing:.2em">' + esc(pin) + '</b></div></div>' +
    '<div class="small">On first sign-in the app asks them to choose their own PIN – after that nobody (not even head office) can see it. Until then it stays visible in People.</div>');
  try { D = await call('listUsers'); draw(); } catch (e) { $('#pp_b', m).innerHTML = '<div class="warnbox bad">' + esc(e.message) + '</div>'; }
}

/* ───────────── DISCOUNT APPROVALS (owner / approvers) ───────────── */
let apOpen = false;
async function checkApprovals() {
  if (!can('approve')) return;
  let r; try { r = await call('approvalList'); } catch (e) { return; }
  S.apPending = r.pending;
  let bar = $('#apbar');
  if (!r.pending.length) { if (bar) bar.remove(); return; }
  if (!bar) { bar = document.createElement('div'); bar.id = 'apbar'; document.body.appendChild(bar); bar.onclick = () => approvalsSheet(); }
  const a = r.pending[0];
  bar.innerHTML = '<b>Discount approval needed</b> ' + esc(a.by) + ' · ' + a.pct + '% (₹' + money(a.disc) + ' off ₹' + money(a.gross) + ')' + (r.pending.length > 1 ? ' + ' + (r.pending.length - 1) + ' more' : '') + ' <u>Review</u>';
  if (navigator.vibrate) try { navigator.vibrate([120, 60, 120]); } catch (e) { }
  if (!apOpen && !$('.modal')) approvalsSheet();
}
async function approvalsSheet(showRecent) {
  apOpen = true;
  const m = modal('Discount approvals', '<div id="ap_b"><div class="empty"><span class="spin dk"></span></div></div>', { onClose: () => { apOpen = false; } });
  const draw = r => {
    const card = a => '<div class="card" style="padding:12px"><div class="row"><b class="grow">' + esc(a.by) + '</b><span class="pill p-warn">' + a.pct + '%</span></div>' +
      '<div class="small" style="margin-top:4px">' + esc((LOC_SHORT[a.loc] || a.loc) + (a.event ? ' · ' + a.event : '')) + ' · ₹' + money(a.disc) + ' off ₹' + money(a.gross) + ' · ' + new Date(a.at).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) + '</div>' +
      (a.items ? '<div class="tiny mute" style="margin-top:4px">' + esc(a.items) + '</div>' : '') +
      (a.status === 'Pending' ? '<div class="row" style="margin-top:10px"><button class="btn ghost" data-no="' + esc(a.id) + '" style="color:var(--bad)">Reject</button><div class="grow"></div><button class="btn gold" data-yes="' + esc(a.id) + '">Approve ' + a.pct + '%</button></div>'
        : '<div class="tiny" style="margin-top:6px">' + esc(a.status + ' by ' + a.decidedBy + (a.bill ? ' · used on ' + a.bill : '')) + '</div>') + '</div>';
    $('#ap_b', m).innerHTML = (r.pending.length ? r.pending.map(card).join('') : '<div class="empty small">No requests waiting.</div>') +
      (showRecent && r.recent.length ? '<h3>Earlier (last 36 hours)</h3>' + r.recent.map(card).join('') : '');
    const act = async (id, yes) => { const x = await run(yes ? 'Approving…' : 'Rejecting…', () => call('decideApproval', { id: id, approve: yes })).catch(() => null); if (x) { draw(x); toast(yes ? 'Approved – the manager can save the bill now' : 'Rejected'); checkApprovals(); } };
    $$('[data-yes]', m).forEach(b => b.onclick = () => act(b.dataset.yes, true));
    $$('[data-no]', m).forEach(b => b.onclick = () => act(b.dataset.no, false));
  };
  try { draw(await call('approvalList')); } catch (e) { $('#ap_b', m).innerHTML = '<div class="warnbox bad">' + esc(e.message) + '</div>'; }
}

<script>
'use strict';
/* ───────────── BILLING (Bill tab) ───────────── */
ICONS.bill = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 2h14v20l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>';
S.view = store.get('view0') || 'bill';
const B = { boot: null, loc: store.get('bloc') || '', event: store.get('bevent') || '', by: store.get('bby') || '', lines: [], cust: { name: '', phone: '', gstin: '', address: '' },
  noDetails: false, biz: false, billDisc: 0, pay: { mode: 'Cash', cash: '', upi: '', card: '', other: '', got: '' }, cid: newCid(), q: '', today: null, todayDate: '', search: '' };
function newCid() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
const money = x => (Number(x) || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* same maths as billCalc_ in Billing.gs */
function billCalc(lines, billDisc, inter) {
  const r2 = x => Math.round((Number(x) || 0) * 100 + 1e-9) / 100;
  const out = lines.map(l => {
    const qty = Math.round((Number(l.qty) || 0) * 1000) / 1000, rate = r2(l.rate);
    const gross = r2(qty * rate);
    const ld = r2(gross * Math.min(Math.max(Number(l.discPct) || 0, 0), 100) / 100);
    return { qty: qty, rate: rate, gross: gross, disc: ld, gst: Number(l.gst) || 0 };
  });
  const afterLine = out.reduce((a, l) => a + (l.gross - l.disc), 0);
  let bd = Math.min(r2(billDisc), r2(afterLine));
  if (bd > 0 && afterLine > 0) {
    let left = bd;
    out.forEach((l, i) => {
      const base = l.gross - l.disc;
      const share = i === out.length - 1 ? r2(left) : r2(bd * base / afterLine);
      const s = Math.min(share, r2(base)); l.disc = r2(l.disc + s); left = r2(left - s);
    });
  }
  const t = { gross: 0, disc: 0, amount: 0, taxable: 0, cgst: 0, sgst: 0, igst: 0, qty: 0, rates: {} };
  out.forEach(l => {
    l.amount = r2(l.gross - l.disc);
    l.taxable = r2(l.amount * 100 / (100 + l.gst));
    const tax = r2(l.amount - l.taxable);
    if (inter) { l.igst = tax; l.cgst = 0; l.sgst = 0; } else { l.cgst = r2(tax / 2); l.sgst = r2(tax - l.cgst); l.igst = 0; }
    ['gross', 'disc', 'amount', 'taxable'].forEach(k => t[k] = r2(t[k] + l[k]));
    t.qty = Math.round((t.qty + l.qty) * 1000) / 1000;
    const k = String(l.gst); const g = t.rates[k] = t.rates[k] || { amount: 0, taxable: 0, cgst: 0, sgst: 0, igst: 0 };
    g.amount = r2(g.amount + l.amount); g.taxable = r2(g.taxable + l.taxable);
  });
  Object.keys(t.rates).forEach(k => {          // tax split per rate on the bill total, so CGST = SGST (± 1 paisa)
    const g = t.rates[k], tax = r2(g.amount - g.taxable);
    if (inter) g.igst = tax; else { g.cgst = r2(tax / 2); g.sgst = r2(tax - g.cgst); }
    t.cgst = r2(t.cgst + g.cgst); t.sgst = r2(t.sgst + g.sgst); t.igst = r2(t.igst + g.igst);
  });
  t.total = Math.round(t.amount);
  t.roundOff = r2(t.total - t.amount);
  return { lines: out, totals: t };
}

function noDisc() { return !can('disc10'); }
function discLimits() { const d = (B.boot && B.boot.disc) || { self: 10, max: 25 }; return d; }
function listsOk() {
  if (!B.boot) return;
  if (B.event && !(B.boot.events || []).some(e => e.name === B.event)) { B.event = ''; store.set('bevent', null); }
  if (noDisc()) { B.billDisc = 0; B.lines.forEach(l => l.discPct = ''); }
  if (!can('otherItem')) B.lines = B.lines.filter(l => l.sku);
}
async function refreshLists(force) {
  if (!B.boot) return;
  if (!force && B.boot.listsAt && Date.now() - new Date(B.boot.listsAt).getTime() < 180000) return;
  try { const r = await call('billLists'); const changed = JSON.stringify([r.events, r.staff]) !== JSON.stringify([B.boot.events, B.boot.staff]); Object.assign(B.boot, r); if (changed && S.view === 'bill' && B.loc && !$('.modal')) { listsOk(); drawBill(); } } catch (e) { }
}
function dfltGst() { return Number(B.boot && B.boot.setup['Default GST %']) || 5; }
function lineQty(l) { return l.unit === 'kg' ? (l.inUnit === 'g' ? num(l.inQty) / 1000 : num(l.inQty)) : num(l.inQty); }
function interState() { const g = (B.cust.gstin || '').trim().toUpperCase(); return B.biz && g.length >= 2 && g.slice(0, 2) !== ((B.boot && B.boot.setup['State code']) || '09'); }
function calcNow() {
  const ls = B.lines.map(l => ({ qty: lineQty(l), rate: l.rate, discPct: B.coupon ? 0 : l.discPct, gst: l.gst }));
  if (B.coupon) { const g = billCalc(ls, 0, interState()).totals.gross; return billCalc(ls, g >= B.coupon.min ? Math.round(g * B.coupon.pct) / 100 : 0, interState()); }
  return billCalc(ls, B.billDisc, interState());
}
/* ───── customer: referral code, referred-by, coupons ───── */
let custT = null;
function custLookup(force) {
  const ph = (B.cust.phone || '').replace(/\D/g, '').replace(/^(91|0)(?=\d{10}$)/, '');
  if (!/^[6-9]\d{9}$/.test(ph)) { if (B.ci) { B.ci = null; B.coupon = null; B.refBy = ''; drawCust(); refreshTotals(); } return; }
  if (B.ci && B.ci.phone === ph && !force) return;
  clearTimeout(custT);
  custT = setTimeout(async () => {
    try { const r = await call('customerInfo', { phone: ph, ref: B.refBy || '' }); if ((B.cust.phone || '').replace(/\D/g, '').slice(-10) !== ph) return;
      B.ci = r; if (r.name && !B.cust.name) { B.cust.name = r.name; const n = $('#b_nm'); if (n) n.value = r.name; }
      if (B.coupon && !r.coupons.some(c => c.code === B.coupon.code)) B.coupon = null;
      drawCust(); refreshTotals(); } catch (e) { }
  }, force ? 0 : 350);
}
function drawCust() {
  const box = $('#b_ci'); if (!box) return;
  const c = B.ci; if (!c || B.noDetails) { box.innerHTML = ''; return; }
  let h = '';
  if (c.isNew) {
    h += '<div class="tiny"><span class="pill p-new">New customer</span> Gets their own referral code with this bill.</div>' +
      '<label class="f" style="margin-top:8px">Referred by (friend\'s referral code or mobile) – optional</label><div class="row" style="flex-wrap:nowrap"><input class="i grow" id="b_ref" value="' + esc(B.refBy || '') + '" placeholder="e.g. NV7K3PQ" style="text-transform:uppercase"><button class="btn sm ghost" id="b_refc">Check</button></div>' +
      (c.ref ? '<div class="tiny ' + (c.ref.ok ? '' : 'neg') + '" style="margin-top:4px">' + esc(c.ref.ok ? '✓ Referred by ' + c.ref.label + ' – they get a ' + c.rules.pct + '% coupon when this customer\'s first ₹' + c.rules.refMin + '+ bill is saved.' : c.ref.msg) + '</div>' : '');
  } else {
    h += '<div class="tiny"><span class="pill p-ok">' + (c.bills ? c.bills + ' earlier bill' + (c.bills === 1 ? '' : 's') : 'Known customer') + '</span>' + (c.code ? ' Referral code <b>' + esc(c.code) + '</b>' : '') + (c.referredBy && /^Waiting/.test(c.referral) ? ' · referred by ' + esc(c.referredBy) + ' (' + esc(c.referral.toLowerCase()) + ')' : '') + '</div>';
  }
  if (c.coupons.length) h += '<div style="margin-top:8px">' + c.coupons.map(cp => { const on = B.coupon && B.coupon.code === cp.code;
    return '<div class="cpn' + (on ? ' on' : '') + '"><div class="grow"><b>' + (cp.lucky ? '🍀 ' : '') + esc(cp.code) + ' · ' + cp.pct + '% off</b><div class="tiny mute">on a bill of ₹' + cp.min + '+ · valid till ' + esc(cp.till.split('-').reverse().join('-')) + (cp.lucky ? ' · lucky draw' : cp.from ? ' · for referring ' + esc(cp.from) : '') + '</div></div>' +
      (cp.next ? '<span class="tiny mute" style="text-align:right">From the<br>next visit</span>' : '<button class="btn sm ' + (on ? 'ghost' : 'gold') + '" data-cp="' + esc(cp.code) + '">' + (on ? 'Remove' : 'Use') + '</button>') + '</div>'; }).join('') + '</div>';
  box.innerHTML = h;
  if ($('#b_ref')) { $('#b_ref').oninput = e => { B.refBy = e.target.value.trim(); }; $('#b_refc').onclick = () => custLookup(true); $('#b_ref').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); custLookup(true); } }; }
  $$('[data-cp]', box).forEach(b => b.onclick = () => {
    const cp = c.coupons.find(x => x.code === b.dataset.cp);
    if (B.coupon && B.coupon.code === cp.code) B.coupon = null;
    else { B.coupon = cp; B.billDisc = 0; B.lines.forEach(l => l.discPct = ''); }
    drawBill();
  });
}

async function viewBill() {
  if (!B.boot) {
    $('#view').innerHTML = '<div class="empty"><span class="spin dk"></span><div>Loading billing…</div></div>';
    try { B.boot = await call('billBoot', { loc: B.loc }); if (B.boot.today) { B.today = B.boot.today; B.todayDate = today(); } }
    catch (e) { $('#view').innerHTML = '<div class="warnbox bad">' + esc(e.message) + '</div>'; return; }
  }
  if (B.loc && !B.boot.locs.some(l => l.name === B.loc)) { B.loc = ''; B.today = null; }
  if (!B.loc && S.user && S.user.home && B.boot.locs.some(l => l.name === S.user.home)) { B.loc = S.user.home; store.set('bloc', B.loc); }
  if (!B.loc) return pickBillLoc();

}
function pickBillLoc() {
  $('#view').innerHTML = '<h2>Where are you billing?</h2>' + B.boot.locs.map(l => '<button class="btn ghost block" style="margin-bottom:8px;text-align:left" data-l="' + esc(l.name) + '"><b>' +
    esc(l.name === 'Event' ? 'Event stall' : l.name) + '</b><div class="tiny mute">Bills ' + esc(l.series) + '/' + esc(B.boot.fy) + '/… · FSSAI ' + esc(l.fssai) + '</div></button>').join('');
  $$('#view [data-l]').forEach(b => b.onclick = () => { B.loc = b.dataset.l; store.set('bloc', B.loc); B.today = null; listsOk(); viewBill(); });
}
function locLabel(l) { return l === 'Event' ? 'Event stall' + (B.event ? ' – ' + B.event : '') : l; }

function drawBill() {
  const c = calcNow(), t = c.totals;

/* ───────────── PRINTING ─────────────
   The bill is drawn as a black-and-white picture (203 dpi = 8 dots per mm) and sent to the printer
   from a separate print window (Bluetooth is not allowed inside the app frame). */
function billCanvas(b, mm) {
  const W = Math.round((mm || 100) * 8), k = Math.max(W / 800, 0.8), M = Math.round(14 * W / 800);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = 6000;
  const x = cv.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, cv.height); x.fillStyle = '#000'; x.textBaseline = 'top';
  let y = M;
  const F = (sz, bold) => { x.font = (bold ? '700 ' : '400 ') + Math.round(sz * k) + 'px Arial, Helvetica, sans-serif'; return Math.round(sz * k); };
  const wrap = (txt, maxW) => {
    const out = []; String(txt || '').split('\n').forEach(par => {
      let line = ''; par.split(' ').forEach(w => { const t = line ? line + ' ' + w : w; if (x.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; });
      if (line) out.push(line);
    }); return out;
  };
  const text = (txt, sz, bold, align, gap) => {
    const h = F(sz, bold);
    wrap(txt, W - 2 * M).forEach(l => { x.textAlign = align || 'left'; x.fillText(l, align === 'center' ? W / 2 : align === 'right' ? W - M : M, y); y += Math.round(h * 1.22); });
    y += Math.round((gap || 0) * k);
  };
  const lr = (a, bTxt, sz, bold) => { const h = F(sz, bold); x.textAlign = 'left'; x.fillText(a, M, y); x.textAlign = 'right'; x.fillText(bTxt, W - M, y); y += Math.round(h * 1.3); };
  const rule = (thick) => { x.fillRect(M, y, W - 2 * M, Math.max(1, Math.round((thick || 2) * k))); y += Math.round(10 * k); };
  const s = b.seller, c = b.customer, t = b.totals;
  text(s.brand, 46, true, 'center', 2);
  text(s.legal, 23, true, 'center');
  text(s.store + (s.storeAddr && s.storeAddr !== s.store ? ': ' + s.storeAddr : ''), 19, false, 'center');
  text('GSTIN: ' + s.gstin, 22, true, 'center');
  text('FSSAI Lic. No.: ' + s.fssai, 20, true, 'center');
  text('CIN: ' + s.cin, 18, false, 'center');
  text('Regd. Office: ' + s.regd, 17, false, 'center');
  text('Ph: ' + s.phone + (s.email ? '  ' + s.email : ''), 17, false, 'center', 4);
  rule(3); text(b.status === 'Cancelled' ? '*** CANCELLED ***' : 'TAX INVOICE', 28, true, 'center', -2); rule(3);
  lr('Invoice: ' + b.no, b.date.split('-').reverse().join('-') + ' ' + b.time, 21, true);
  if (c.name || c.phone) text('Customer: ' + [c.name, c.phone ? '+91 ' + c.phone : ''].filter(Boolean).join(', '), 20);
  else text('Customer: Walk-in', 20);
  if (c.gstin) text('Customer GSTIN: ' + c.gstin, 20, true);
  if (c.address) text(c.address, 18);
  text('Place of supply: ' + b.pos + '   Reverse charge: ' + (b.reverseCharge || 'No'), 18, false, 'left', 4);
  rule(2);
  // table
  const cQ = W - M - Math.round(330 * k), cR = W - M - Math.round(170 * k);
  const hdr = F(18, true); x.textAlign = 'left'; x.fillText('Item', M, y); x.textAlign = 'right'; if (W >= 560) { x.fillText('Qty', cQ + Math.round(110 * k), y); x.fillText('Rate', cR + Math.round(40 * k), y); } x.fillText('Amount', W - M, y);
  y += Math.round(hdr * 1.4); rule(1);
  b.lines.forEach(l => {
    F(20, true);
    const nameLines = wrap(l.n + '. ' + l.name, cQ - M - Math.round(10 * k));
    if (W >= 560) {
      nameLines.forEach((nl, i) => { x.textAlign = 'left'; x.fillText(nl, M, y); if (i === 0) {
        F(20, false); x.textAlign = 'right';
        x.fillText(l.unit === 'kg' ? Number(l.qty).toFixed(3) + 'kg' : l.qty + ' pc', cQ + Math.round(110 * k), y);
        x.fillText(money(l.rate).replace(/\.00$/, ''), cR + Math.round(40 * k), y); F(20, true); x.fillText(money(l.amount), W - M, y); }
        y += Math.round(20 * k * 1.25); });
    } else {
      wrap(l.n + '. ' + l.name, W - 2 * M).forEach(nl => { x.textAlign = 'left'; x.fillText(nl, M, y); y += Math.round(20 * k * 1.25); });
      F(20, false); lr((l.unit === 'kg' ? Number(l.qty).toFixed(3) + ' kg' : l.qty + ' pc') + ' × ' + money(l.rate), money(l.amount), 20, true);
    }
    F(16, false); x.textAlign = 'left'; x.fillText('HSN ' + (l.hsn || '-') + '  GST ' + l.gst + '%' + (l.disc ? '  Disc ' + money(l.disc) : ''), M + Math.round(24 * k), y); y += Math.round(16 * k * 1.5);
  });
  rule(2);
  lr('Total (incl. GST)', money(t.gross), 20);
  if (t.disc) lr('Discount', '- ' + money(t.disc), 20);
  lr('Taxable value', money(t.taxable), 20);
  if (b.inter) lr('IGST', money(t.igst), 20); else Object.keys(t.rates).forEach(r => { lr('CGST @' + (r / 2) + '%', money(t.rates[r].cgst), 20); lr('SGST @' + (r / 2) + '%', money(t.rates[r].sgst), 20); });
  if (t.roundOff) lr('Round off', (t.roundOff > 0 ? '+ ' : '- ') + money(Math.abs(t.roundOff)), 20);
  rule(3); lr('GRAND TOTAL', 'Rs ' + money(t.total), 30, true); y += Math.round(2 * k);
  text(b.words, 18, false, 'left', 4);
  const pay = b.pay.mode === 'Split' ? ['cash', 'upi', 'card', 'other'].filter(q => b.pay[q]).map(q => q.toUpperCase() + ' ' + money(b.pay[q])).join(' + ') : b.pay.mode + ' ' + money(t.total);
  text('Paid: ' + pay + '   Billed by: ' + b.by, 18, false, 'left', 6);
  rule(1);
  if (b.customer && b.customer.refCode) text('Your referral code: ' + b.customer.refCode + ' – a friend shops for Rs 1,000+, you get a 10% coupon', 17, true, 'center');
  text(s.footer, 18, false, 'center');
  text('Computer-generated invoice. ' + (c.phone ? 'Digital copy sent on WhatsApp.' : ''), 16, false, 'center');
  y += Math.round(30 * k);
  const H = Math.ceil(y / 8) * 8;
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  out.getContext('2d').drawImage(cv, 0, 0);
  return out;
}
/** 1 bit per dot, 1 = black, rows padded to whole bytes. */
function packBits(cv) {
