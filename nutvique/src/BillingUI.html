<script>
'use strict';
/* ───────────── BILLING (Bill tab) ───────────── */
ICONS.bill = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 2h14v20l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>';
S.view = store.get('view0') || 'bill';
const B = { boot: null, loc: store.get('bloc') || '', event: store.get('bevent') || '', by: store.get('bby') || '', lines: [], cust: { name: '', phone: '', gstin: '', address: '' },
  noDetails: false, biz: false, billDisc: 0, pay: { mode: 'Cash', cash: '', upi: '', card: '', other: '', got: '' }, cid: newCid(), q: '', today: null, todayDate: '', search: '' };
function newCid() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
const money = x => (Number(x) || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* same maths as billCalc_ in Billing.gs */
function billCalc(lines, billDisc, inter) {
  const r2 = x => Math.round((Number(x) || 0) * 100 + 1e-9) / 100;
  const out = lines.map(l => {
    const qty = Math.round((Number(l.qty) || 0) * 1000) / 1000, rate = r2(l.rate);
    const gross = r2(qty * rate);
    const ld = r2(gross * Math.min(Math.max(Number(l.discPct) || 0, 0), 100) / 100);
    return { qty: qty, rate: rate, gross: gross, disc: ld, gst: Number(l.gst) || 0 };
  });
  const afterLine = out.reduce((a, l) => a + (l.gross - l.disc), 0);
  let bd = Math.min(r2(billDisc), r2(afterLine));
  if (bd > 0 && afterLine > 0) {
    let left = bd;
    out.forEach((l, i) => {
      const base = l.gross - l.disc;
      const share = i === out.length - 1 ? r2(left) : r2(bd * base / afterLine);
      const s = Math.min(share, r2(base)); l.disc = r2(l.disc + s); left = r2(left - s);
    });
  }
  const t = { gross: 0, disc: 0, amount: 0, taxable: 0, cgst: 0, sgst: 0, igst: 0, qty: 0, rates: {} };
  out.forEach(l => {
    l.amount = r2(l.gross - l.disc);
    l.taxable = r2(l.amount * 100 / (100 + l.gst));
    const tax = r2(l.amount - l.taxable);
    if (inter) { l.igst = tax; l.cgst = 0; l.sgst = 0; } else { l.cgst = r2(tax / 2); l.sgst = r2(tax - l.cgst); l.igst = 0; }
    ['gross', 'disc', 'amount', 'taxable'].forEach(k => t[k] = r2(t[k] + l[k]));
    t.qty = Math.round((t.qty + l.qty) * 1000) / 1000;
    const k = String(l.gst); const g = t.rates[k] = t.rates[k] || { amount: 0, taxable: 0, cgst: 0, sgst: 0, igst: 0 };
    g.amount = r2(g.amount + l.amount); g.taxable = r2(g.taxable + l.taxable);
  });
  Object.keys(t.rates).forEach(k => {          // tax split per rate on the bill total, so CGST = SGST (± 1 paisa)
    const g = t.rates[k], tax = r2(g.amount - g.taxable);
    if (inter) g.igst = tax; else { g.cgst = r2(tax / 2); g.sgst = r2(tax - g.cgst); }
    t.cgst = r2(t.cgst + g.cgst); t.sgst = r2(t.sgst + g.sgst); t.igst = r2(t.igst + g.igst);
  });
  t.total = Math.round(t.amount);
  t.roundOff = r2(t.total - t.amount);
  return { lines: out, totals: t };
}

function noDisc() { return !can('disc10'); }
function discLimits() { const d = (B.boot && B.boot.disc) || { self: 10, max: 25 }; return d; }
function listsOk() {
  if (!B.boot) return;
  if (B.event && !(B.boot.events || []).some(e => e.name === B.event)) { B.event = ''; store.set('bevent', null); }
  if (noDisc()) { B.billDisc = 0; B.lines.forEach(l => l.discPct = ''); }
  if (!can('otherItem')) B.lines = B.lines.filter(l => l.sku);
}
async function refreshLists(force) {
  if (!B.boot) return;
  if (!force && B.boot.listsAt && Date.now() - new Date(B.boot.listsAt).getTime() < 180000) return;
  try { const r = await call('billLists'); const changed = JSON.stringify([r.events, r.staff]) !== JSON.stringify([B.boot.events, B.boot.staff]); Object.assign(B.boot, r); if (changed && S.view === 'bill' && B.loc && !$('.modal')) { listsOk(); drawBill(); } } catch (e) { }
}
function dfltGst() { return Number(B.boot && B.boot.setup['Default GST %']) || 5; }
function lineQty(l) { return l.unit === 'kg' ? (l.inUnit === 'g' ? num(l.inQty) / 1000 : num(l.inQty)) : num(l.inQty); }
function interState() { const g = (B.cust.gstin || '').trim().toUpperCase(); return B.biz && g.length >= 2 && g.slice(0, 2) !== ((B.boot && B.boot.setup['State code']) || '09'); }
function calcNow() {
  return billCalc(B.lines.map(l => ({ qty: lineQty(l), rate: l.rate, discPct: l.discPct, gst: l.gst })), B.billDisc, interState());
}

async function viewBill() {
  if (!B.boot) {
    $('#view').innerHTML = '<div class="empty"><span class="spin dk"></span><div>Loading billing…</div></div>';
    try { B.boot = await call('billBoot', { loc: B.loc }); if (B.boot.today) { B.today = B.boot.today; B.todayDate = today(); } }
    catch (e) { $('#view').innerHTML = '<div class="warnbox bad">' + esc(e.message) + '</div>'; return; }
  }
  if (!B.loc && S.user && S.user.home) { B.loc = S.user.home; store.set('bloc', B.loc); }
  if (!B.loc) return pickBillLoc();
  listsOk();
  drawBill();
  scaleAuto();
  refreshLists();
  if (!B.today || B.todayDate !== today()) loadToday();
}
function pickBillLoc() {
  $('#view').innerHTML = '<h2>Where are you billing?</h2>' + B.boot.locs.map(l => '<button class="btn ghost block" style="margin-bottom:8px;text-align:left" data-l="' + esc(l.name) + '"><b>' +
    esc(l.name === 'Event' ? 'Event stall' : l.name) + '</b><div class="tiny mute">Bills ' + esc(l.series) + '/' + esc(B.boot.fy) + '/… · FSSAI ' + esc(l.fssai) + '</div></button>').join('');
  $$('#view [data-l]').forEach(b => b.onclick = () => { B.loc = b.dataset.l; store.set('bloc', B.loc); B.today = null; listsOk(); viewBill(); });
}
function locLabel(l) { return l === 'Event' ? 'Event stall' + (B.event ? ' – ' + B.event : '') : l; }

function drawBill() {
  const c = calcNow(), t = c.totals;
  const prev = document.activeElement && document.activeElement.id;
  $('#view').innerHTML =
    '<div class="row" style="margin-bottom:8px"><h2 class="grow" style="margin:0">New bill</h2><button class="btn sm ghost" id="b_loc">' + esc(LOC_SHORT[B.loc] || locLabel(B.loc)) + ' ▾</button>' +
    '<button class="btn sm ghost" id="b_cam" title="Scan barcodes with the camera">📷</button><button class="btn sm ghost" id="b_scale" title="Bluetooth weighing scale">' + scaleLabel() + '</button>' +
    (can('billSetup') || can('events') ? '<button class="btn sm ghost" id="b_setup">Bill setup</button>' : '') + '</div>' +
    (B.loc === 'Event' ? '<div class="card" style="padding:10px"><label class="f">Event (printed on the bill)</label>' +
      ((B.boot.events || []).length ? '<select class="i" id="b_ev"><option value="">– Pick the event –</option>' + B.boot.events.map(e => '<option value="' + esc(e.name) + '"' + (e.name === B.event ? ' selected' : '') + '>' + esc(e.name) + '</option>').join('') + '</select>' +
        (B.event ? '<div class="tiny mute" style="margin-top:4px">' + esc(((B.boot.events.find(e => e.name === B.event) || {}).venue) || '') + '</div>' : '')
        : '<div class="warnbox" style="margin:0">No event is open. ' + (can('events') ? 'Add the event with the button below – it shows for every employee at once.' : 'Ask the owner to add the event.') + '</div>') +
      (can('events') ? '<button class="btn sm" id="b_addev" style="margin-top:8px">+ Add event</button>' : '') + '</div>' : '') +
    '<div class="bwrap"><div>' +
    '<div class="bsrch"><input id="bq" type="search" placeholder="Type item name, SKU or scan barcode…" autocomplete="off" value="' + esc(B.search) + '"><div id="bres"></div></div>' +
    '<div id="blines">' + (B.lines.length ? B.lines.map((l, i) => lineCard(l, i, c.lines[i])).join('') : '<div class="empty small">No items yet. Search above' + (IN_APP ? ', tap 📷 to scan barcodes' : '') + (can('otherItem') ? ', or <a href="#" id="b_oth0">add an item that is not in the list</a>.' : '.') + '</div>') + '</div>' +
    (B.lines.length && can('otherItem') ? '<div style="margin-top:8px"><button class="btn sm ghost" id="b_oth">+ Item not in the list</button></div>' : '') +
    '</div><div class="bside">' +
    '<div class="card"><h3>Customer</h3>' +
    '<div class="grid2"><div><label class="f">Mobile (for WhatsApp bill)</label><input class="i" id="b_ph" type="tel" inputmode="numeric" maxlength="14" value="' + esc(B.cust.phone) + '" placeholder="10-digit mobile"' + (B.noDetails ? ' disabled' : '') + '></div>' +
    '<div><label class="f">Name (optional)</label><input class="i" id="b_nm" value="' + esc(B.cust.name) + '" placeholder="Customer name"></div></div>' +
    '<label class="chk"><input type="checkbox" id="b_nd"' + (B.noDetails ? ' checked' : '') + '>Customer does not want to share – print the bill only</label>' +
    '<label class="chk"><input type="checkbox" id="b_biz"' + (B.biz ? ' checked' : '') + '>Business customer – GST bill with their GSTIN</label>' +
    (B.biz ? '<div class="grid2"><div><label class="f">Customer GSTIN</label><input class="i" id="b_gst" maxlength="15" style="text-transform:uppercase" value="' + esc(B.cust.gstin) + '"></div>' +
      '<div><label class="f">Business name & address</label><textarea class="i" id="b_ad" rows="2">' + esc(B.cust.address) + '</textarea></div></div>' +
      (interState() ? '<div class="warnbox" style="margin-top:8px">Other state GSTIN → IGST will be charged.</div>' : '') : '') +
    '</div>' +
    '<div class="card"><h3>Payment</h3><div class="seg" id="b_pm">' + ['Cash', 'UPI', 'Card', 'Split'].map(m => '<button data-m="' + m + '" class="' + (B.pay.mode === m ? 'on' : '') + '">' + m + '</button>').join('') + '</div>' +
    (B.pay.mode === 'Split' ? '<div class="grid3" style="margin-top:8px">' + [['cash', 'Cash'], ['upi', 'UPI'], ['card', 'Card']].map(k => '<div><label class="f">' + k[1] + ' ₹</label><input class="i num" data-sp="' + k[0] + '" inputmode="decimal" value="' + esc(B.pay[k[0]]) + '"></div>').join('') + '</div>' +
      '<div class="tiny mute" id="b_spl" style="margin-top:4px"></div>' : '') +
    (B.pay.mode === 'Cash' ? '<div class="row" style="margin-top:8px"><div class="grow"><label class="f">Cash received ₹ (optional)</label><input class="i num" id="b_got" inputmode="decimal" value="' + esc(B.pay.got) + '"></div><div class="grow"><label class="f">Give back</label><div class="qty" id="b_chg">–</div></div></div>' : '') +
    '<div class="row" style="margin-top:8px">' + (noDisc() ? '' : '<div class="grow"><label class="f">Bill discount ₹</label><input class="i num" id="b_bd" inputmode="decimal" value="' + (B.billDisc || '') + '"></div>') +
    '<div class="grow"><label class="f">Billed by</label><div class="i" style="background:#f4f2ec">' + esc(S.user ? S.user.name : '') + '</div></div></div>' +
    (noDisc() ? '<div class="tiny mute" style="margin-top:6px">Discounts: only managers can give them.</div>' : '<div class="tiny mute" style="margin-top:6px" id="b_dh"></div>') +
    '</div>' +
    '<div class="card btot" id="b_tot">' + totHtml(t) + '</div>' +
    '<button class="btn gold block" id="b_save" style="min-height:52px;font-size:17px"' + (B.lines.length ? '' : ' disabled') + '>Save bill · ₹' + money(t.total) + '</button>' +
    (B.lines.length ? '<button class="btn ghost block" id="b_clr" style="margin-top:8px">Clear</button>' : '') +
    '</div></div>' +
    '<div class="card" style="margin-top:16px" id="b_today"><div class="empty small"><span class="spin dk"></span></div></div>';
  bindBill();
  if (B.today) drawToday();
  if (prev && $('#' + prev)) { const el = $('#' + prev); el.focus(); if (el.setSelectionRange && el.type !== 'number' && el.type !== 'email') try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { } }
  else if (window.innerWidth > 900) $('#bq').focus();
}
function discInfo(t) {
  const pct = t.gross ? Math.round(t.disc / t.gross * 10000) / 100 : 0, L = discLimits();
  if (!(t.disc > 0)) return { pct: 0, need: '' };
  if (isOwner()) return { pct: pct, need: '' };
  if (pct > L.max + 0.01) return { pct: pct, need: 'max' };
  if (pct > L.self + 0.01 && !can('approve')) return { pct: pct, need: 'approval' };
  return { pct: pct, need: '' };
}
function totHtml(t) {
  const inter = interState();
  return '<div><span>Items total (incl. GST)</span><span>₹' + money(t.gross) + '</span></div>' +
    (t.disc ? '<div><span>Discount (' + (t.gross ? Math.round(t.disc / t.gross * 1000) / 10 : 0) + '%)</span><span>− ₹' + money(t.disc) + '</span></div>' : '') +
    '<div class="mute"><span>Taxable value</span><span>₹' + money(t.taxable) + '</span></div>' +
    (inter ? '<div class="mute"><span>IGST</span><span>₹' + money(t.igst) + '</span></div>' : '<div class="mute"><span>CGST + SGST</span><span>₹' + money(t.cgst) + ' + ₹' + money(t.sgst) + '</span></div>') +
    (t.roundOff ? '<div class="mute"><span>Round off</span><span>' + (t.roundOff > 0 ? '+' : '−') + ' ₹' + money(Math.abs(t.roundOff)) + '</span></div>' : '') +
    '<div class="g"><span>To pay</span><span>₹' + money(t.total) + '</span></div>';
}
function lineCard(l, i, c) {
  const p = l.sku ? S.bySku[l.sku] : null;
  const have = l.sku && B.loc !== 'Event' && !/^NV-HMP-/.test(l.sku) ? ((stockOf(l.sku).q || {})[B.loc] || 0) : null;
  let h = '<div class="bl" data-i="' + i + '"><div class="t"><b>' + (l.sku ? esc(l.name) : '<input class="i" data-f="name" placeholder="Item name" value="' + esc(l.name) + '">') + '</b><button class="btn sm ghost" data-del="' + i + '" aria-label="Remove">×</button></div>';
  if (!l.sku) h += '<div class="grid3" style="margin-top:6px"><div><label class="f">Rate ₹ incl. GST</label><input class="i num" data-f="rate" inputmode="decimal" value="' + (l.rate || '') + '"></div>' +
    '<div><label class="f">HSN</label><input class="i" data-f="hsn" inputmode="numeric" value="' + esc(l.hsn || '') + '"></div><div><label class="f">GST %</label><input class="i num" data-f="gst" inputmode="decimal" value="' + (l.gst || '') + '"></div></div>';
  h += '<div class="q"><input class="i" data-f="inQty" inputmode="decimal" value="' + esc(l.inQty) + '">' +
    (l.unit === 'kg' ? '<select class="i" data-f="inUnit"><option value="g"' + (l.inUnit === 'g' ? ' selected' : '') + '>g</option><option value="kg"' + (l.inUnit === 'kg' ? ' selected' : '') + '>kg</option></select>' :
      (l.sku ? '<span class="mute">pcs</span>' : '<select class="i" data-f="unit"><option value="pcs">pcs</option><option value="kg"' + (l.unit === 'kg' ? ' selected' : '') + '>kg</option></select>')) +
    '<span class="mute small">× ₹' + money(l.rate) + (l.unit === 'kg' ? '/kg' : '') + '</span>' +
    (noDisc() ? '' : '<input class="i dsc" data-f="discPct" inputmode="decimal" placeholder="Disc %" value="' + (l.discPct || '') + '">') +
    '<span class="amt">₹' + money(c ? c.amount : 0) + '</span></div>';
  if (l.unit === 'kg') h += '<div class="qk">' + (IN_APP ? '<button data-w="' + i + '" class="sw">⚖ Scale</button>' : '') + [100, 200, 250, 500, 1000].map(g => '<button data-g="' + g + '">' + (g >= 1000 ? g / 1000 + ' kg' : g + ' g') + '</button>').join('') + '</div>';
  h += '<div class="tiny mute" style="margin-top:4px">' + (l.sku ? esc(l.sku) + ' · ' : '') + 'HSN ' + esc(l.hsn || '–') + ' · GST ' + (l.gst || dfltGst()) + '%' +
    (have != null ? ' · <span class="' + (have - lineQty(l) < 0 ? 'neg' : '') + '">stock here ' + qfmt(have) + ' ' + esc(l.unit) + '</span>' : '') + (p && p.mrp ? ' · MRP ₹' + money(p.mrp) : '') + '</div></div>';
  return h;
}
function refreshTotals() {
  const c = calcNow();
  $$('#blines .bl').forEach(el => { const i = +el.dataset.i, a = $('.amt', el); if (a && c.lines[i]) a.textContent = '₹' + money(c.lines[i].amount); });
  $('#b_tot').innerHTML = totHtml(c.totals);
  const di = discInfo(c.totals), L = discLimits(), dh = $('#b_dh');
  if (dh) dh.innerHTML = di.need === 'max' ? '<span class="neg">' + di.pct + '% – the maximum discount is ' + L.max + '%.</span>' : di.need === 'approval' ? '<span class="neg">' + di.pct + '% – above ' + L.self + '% needs the owner\'s approval (asked when you save).</span>'
    : (isOwner() || can('approve') ? 'Discount: no limit for you' + (isOwner() ? '' : ' up to ' + L.max + '%') + '.' : 'Discount: up to ' + L.self + '% yourself, up to ' + L.max + '% with the owner\'s approval.');
  const sv = $('#b_save'); if (sv) { sv.textContent = (di.need === 'approval' && !B.approval ? 'Ask owner · ' : 'Save bill · ') + '₹' + money(c.totals.total); sv.disabled = !B.lines.length; }
  const chg = $('#b_chg'); if (chg) { const g = num(B.pay.got); chg.textContent = g ? (g - c.totals.total >= 0 ? '₹' + money(g - c.totals.total) : 'short ₹' + money(c.totals.total - g)) : '–'; }
  const sp = $('#b_spl'); if (sp) { const s = num(B.pay.cash) + num(B.pay.upi) + num(B.pay.card); const left = Math.round((c.totals.total - s) * 100) / 100; sp.innerHTML = left ? '<span class="neg">₹' + money(left) + ' still to split</span>' : 'Adds up ✓'; }
  return c;
}
function bindBill() {
  $('#b_loc').onclick = () => { B.loc = ''; store.set('bloc', null); B.today = null; pickBillLoc(); };
  if ($('#b_setup')) $('#b_setup').onclick = billSetupSheet;
  if ($('#b_addev')) $('#b_addev').onclick = addEventSheet;
  if ($('#b_ev')) $('#b_ev').onchange = e => { B.event = e.target.value; store.set('bevent', B.event || null); drawBill(); };
  const q = $('#bq');
  q.oninput = () => { B.search = q.value; drawRes(); };
  q.onkeydown = e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const v = q.value.trim(); if (!v) return;
    const hit = S.products.find(p => p.gtin === v || p.sku === v.toUpperCase()) || resList(v)[0];

function scanSheet(title, onCode, opts) {

  const m = modal(title, '<div class="scanbox"><video id="sc_v" playsinline muted autoplay></video><div class="scanline"></div></div>' +
    '<div id="sc_msg" class="small" style="margin-top:8px;min-height:20px">Point the camera at the barcode.</div><div id="sc_log" class="tiny"></div>' +
    '<button class="btn block" id="sc_done" style="margin-top:10px">Done</button>', { onClose: () => { stop = true; try { reader && reader.reset(); } catch (e) { } if (stream) stream.getTracks().forEach(t => t.stop()); } });
  const v = $('#sc_v', m), msg = $('#sc_msg', m);
  $('#sc_done', m).onclick = () => m.close();
  const hit = txt => {
    txt = String(txt || '').trim(); if (!txt) return;
    const now = Date.now(); if (txt === last && now - lastAt < 2500) return; last = txt; lastAt = now;
    beep(); if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) { }
    const res = onCode(txt);
    if (res) $('#sc_log', m).insertAdjacentHTML('afterbegin', '<div class="' + (res.ok ? '' : 'neg') + '">' + (res.ok ? '✓ ' : '✗ ') + esc(res.text) + '</div>');
    if (opts.once && res && res.ok) m.close();

    try {

      if (native) {

        if (stop) return stream.getTracks().forEach(t => t.stop());
        v.srcObject = stream; await v.play();
        const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'qr_code'] });

      }
    } catch (e) {
      msg.innerHTML = '<span class="neg">' + esc(/Permission|NotAllowed/i.test(e && (e.name + e.message)) ? 'Camera permission is off. Allow the camera for this app in the phone\'s settings, then try again.' : (e && e.message) || 'Camera not available') + '</span>';
    }

}

/* ───── Bluetooth weighing scale (iScale S-07P sends lines like "+001.250 kg", 9600 baud) ───── */
const SC = { state: 'off', kg: 0, stable: false, name: '', dev: null, port: null, buf: '', hist: [], lastDraw: 0 };
const SCALE_SVCS = ['0000ffe0-0000-1000-8000-00805f9b34fb', '0000fff0-0000-1000-8000-00805f9b34fb', '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
  '49535343-fe7d-4ae5-8fa9-9fafd205e455', '0000ff00-0000-1000-8000-00805f9b34fb', '0000ffe5-0000-1000-8000-00805f9b34fb', '0000fee7-0000-1000-8000-00805f9b34fb',
  '0000ae00-0000-1000-8000-00805f9b34fb', '0000ae30-0000-1000-8000-00805f9b34fb', '000018f0-0000-1000-8000-00805f9b34fb', '0000181d-0000-1000-8000-00805f9b34fb',
  '0000ffb0-0000-1000-8000-00805f9b34fb', '0000fe59-0000-1000-8000-00805f9b34fb'];
const SPP = '00001101-0000-1000-8000-00805f9b34fb';
function scaleLabel() { return SC.state === 'on' ? '⚖ ' + (SC.stable ? '' : '~') + fmtKg(SC.kg) : SC.state === 'connecting' ? '⚖ …' : '⚖ Scale'; }
function fmtKg(kg) { return kg < 1 && kg > -1 ? Math.round(kg * 1000) + ' g' : (Math.round(kg * 1000) / 1000).toFixed(3) + ' kg'; }
function scaleShow() {
  const b = $('#b_scale'); if (b) { b.textContent = scaleLabel(); b.classList.toggle('on', SC.state === 'on'); b.classList.toggle('stable', SC.state === 'on' && SC.stable && SC.kg > 0.004); }
  const w = $('#sc_live'); if (w) w.textContent = SC.state === 'on' ? fmtKg(SC.kg) + (SC.stable ? ' · steady' : ' · settling…') : '';
}
function scaleFeed(text) {
  SC.buf = (SC.buf + text).slice(-200);
  const re = /([+-])?\s*(\d{1,3}(?:\.\d{1,4})?)\s*(kg|g)\b/gi;
  let m, lastEnd = 0, got = false;
  while ((m = re.exec(SC.buf))) {
    let kg = Number(m[2]) / (m[3].toLowerCase() === 'g' ? 1000 : 1); if (m[1] === '-') kg = -kg;
    SC.hist.push({ kg: kg, t: Date.now() }); lastEnd = re.lastIndex; got = true;
  }
  if (!got) return;
  SC.buf = SC.buf.slice(lastEnd);
  SC.hist = SC.hist.filter(h => Date.now() - h.t < 2500).slice(-8);
  const last = SC.hist[SC.hist.length - 1], recent = SC.hist.slice(-3);
  SC.kg = last.kg;
  SC.stable = recent.length >= 3 && Math.max.apply(null, recent.map(h => h.kg)) - Math.min.apply(null, recent.map(h => h.kg)) <= 0.002;
  if (Date.now() - SC.lastDraw > 120) { SC.lastDraw = Date.now(); scaleShow(); }
}
async function scaleBle(dev) {
  SC.state = 'connecting'; scaleShow();
  if (!dev) dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: SCALE_SVCS });
  SC.dev = dev; SC.name = dev.name || 'Scale';
  dev.ongattserverdisconnected = () => { if (SC.dev !== dev) return; SC.state = 'connecting'; scaleShow(); setTimeout(() => { if (SC.dev === dev) scaleBle(dev).catch(() => { SC.state = 'off'; scaleShow(); toast('Scale disconnected', true); }); }, 1500); };
  const g = await dev.gatt.connect();
  const dec = new TextDecoder();
  let n = 0;
  for (const s of await g.getPrimaryServices()) {
    let cs = []; try { cs = await s.getCharacteristics(); } catch (e) { }
    for (const c of cs) if (c.properties.notify || c.properties.indicate) {
      try { await c.startNotifications(); c.addEventListener('characteristicvaluechanged', e => scaleFeed(dec.decode(e.target.value))); n++; } catch (e) { }
    }
  }
  if (!n) { try { g.disconnect(); } catch (e) { } throw new Error('Connected to ' + SC.name + ', but it sends no weight over Bluetooth LE. Try "Paired scale (Bluetooth serial)".'); }
  SC.state = 'on'; store.set('scaleMode', 'ble'); scaleShow();
}
async function scaleSerial() {
  SC.state = 'connecting'; scaleShow();
  const port = await navigator.serial.requestPort({ allowedBluetoothServiceClassIds: [SPP], filters: [{ bluetoothServiceClassId: SPP }] });
  await port.open({ baudRate: 9600, dataBits: 8, stopBits: 1, parity: 'none' });
  SC.port = port; SC.name = 'Scale'; SC.state = 'on'; store.set('scaleMode', 'serial'); scaleShow();
  const dec = new TextDecoder();
  (async () => {
    while (SC.port === port && port.readable) {
      const rd = port.readable.getReader();
      try { for (;;) { const { value, done } = await rd.read(); if (done) break; scaleFeed(dec.decode(value)); } } catch (e) { } finally { rd.releaseLock(); }
      if (SC.port !== port) break;
    }
    if (SC.port === port) { SC.state = 'off'; SC.port = null; scaleShow(); toast('Scale disconnected', true); }
  })();
}
function scaleOff() {
  const d = SC.dev, p = SC.port; SC.dev = null; SC.port = null; SC.state = 'off';
  try { d && d.gatt.connected && d.gatt.disconnect(); } catch (e) { } try { p && p.close(); } catch (e) { }
  scaleShow();
}
function scaleSheet() {
  if (!IN_APP) return notInApp('The Bluetooth scale');
  const hasBle = !!navigator.bluetooth, hasSer = !!(navigator.serial);
  const m = modal('Weighing scale', (SC.state === 'on' ? '<div class="bigp"><div><span>' + esc(SC.name) + '</span><b id="sc_live"></b></div></div><button class="btn ghost block" id="sc_off">Disconnect</button>' :
    '<div class="small">Switch the scale on and keep it near this phone. Then pick it from the list.</div>' +
    '<button class="btn block" id="sc_ble" style="margin-top:12px"' + (hasBle ? '' : ' disabled') + '>Connect scale (Bluetooth)</button>' +
    '<button class="btn ghost block" id="sc_ser" style="margin-top:8px"' + (hasSer ? '' : ' disabled') + '>Scale not in the list? Paired scale (Bluetooth serial)</button>' +
    (hasBle ? '' : '<div class="warnbox" style="margin-top:10px">This phone\'s browser has no Bluetooth for web apps (iPhones don\'t). Type the weight by hand, or use an Android phone with Chrome.</div>') +
    '<div class="tiny mute" style="margin-top:10px">For "Paired scale": first pair the scale in the phone\'s Bluetooth settings (PIN usually 1234 or 0000).</div>') +
    '<div class="tiny mute" style="margin-top:10px">When the scale is connected, each loose item you add takes the weight on the scale, and the ⚖ button on an item re-weighs it. You can always type the weight yourself.</div>');
  scaleShow();
  const go = fn => async () => { try { m.close(); await fn(); toast('Scale connected ✓ – put the goods on it'); } catch (e) { SC.state = 'off'; scaleShow(); if (e && e.name === 'NotFoundError') return; toast((e && e.message) || 'Could not connect', true); } };
  if ($('#sc_ble', m)) $('#sc_ble', m).onclick = go(() => scaleBle());
  if ($('#sc_ser', m)) $('#sc_ser', m).onclick = go(scaleSerial);
  if ($('#sc_off', m)) $('#sc_off', m).onclick = () => { scaleOff(); m.close(); };
}
/** Weight on the scale right now, or 0 when there is no steady reading. */
function scaleKg() { return SC.state === 'on' && SC.stable && SC.kg >= 0.005 && Date.now() - ((SC.hist[SC.hist.length - 1] || {}).t || 0) < 3000 ? SC.kg : 0; }
function useScale(i) {
  const l = B.lines[i]; if (!l) return;
  if (SC.state !== 'on') return scaleSheet();
  const kg = scaleKg(); if (!kg) return toast('Put the goods on the scale and wait until the weight is steady', true);
  if (kg >= 1) { l.inUnit = 'kg'; l.inQty = String(Math.round(kg * 1000) / 1000); } else { l.inUnit = 'g'; l.inQty = String(Math.round(kg * 1000)); }
  drawBill(); toast(fmtKg(kg) + ' from the scale');
}
/* Reconnect the scale used last time when the app opens (Chrome remembers the permission). */
async function scaleAuto() {
  if (!IN_APP || SC.state !== 'off') return;
  try {
    if (store.get('scaleMode') === 'ble' && navigator.bluetooth && navigator.bluetooth.getDevices) { const ds = await navigator.bluetooth.getDevices(); if (ds[0]) await scaleBle(ds[0]); }
    else if (store.get('scaleMode') === 'serial' && navigator.serial) { const ps = await navigator.serial.getPorts(); if (ps[0]) { await ps[0].open({ baudRate: 9600 }); SC.port = ps[0]; SC.state = 'on'; scaleShow(); scaleReadPort(ps[0]); } }
  } catch (e) { SC.state = 'off'; scaleShow(); }
}
function scaleReadPort(port) {
  const dec = new TextDecoder();
  (async () => { while (SC.port === port && port.readable) { const rd = port.readable.getReader(); try { for (;;) { const { value, done } = await rd.read(); if (done) break; scaleFeed(dec.decode(value)); } } catch (e) { } finally { rd.releaseLock(); } } })();
}

/* ───── sales report (owner) ───── */
const SR = { period: 'today', from: '', to: '', loc: 'All', data: null, tab: 'store' };
function srRange(p) {
  const d = new Date(), f = x => ymd(x);
  if (p === 'today') return [f(d), f(d)];
  if (p === 'yday') { d.setDate(d.getDate() - 1); return [f(d), f(d)]; }
  if (p === 'week') { const s = new Date(d); s.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return [f(s), f(d)]; }
  if (p === 'month') return [f(new Date(d.getFullYear(), d.getMonth(), 1)), f(d)];
  if (p === 'lmonth') return [f(new Date(d.getFullYear(), d.getMonth() - 1, 1)), f(new Date(d.getFullYear(), d.getMonth(), 0))];
  if (p === 'fy') { const y = d.getMonth() < 3 ? d.getFullYear() - 1 : d.getFullYear(); return [f(new Date(y, 3, 1)), f(d)]; }
  return [SR.from || f(d), SR.to || f(d)];
}
