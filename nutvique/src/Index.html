<!DOCTYPE html>

<style>
:root{--navy:#1F2A44;--navy2:#2B3A5E;--gold:#C9A24A;--cream:#F7F1DE;--bg:#F4F2EC;--card:#fff;--ink:#1d2433;--mute:#6b7280;--line:#e4e1d8;

.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:0 0 calc(16px + env(safe-area-inset-bottom))}

.x{background:none;border:0;color:var(--cream);font-size:24px;line-height:1;cursor:pointer;padding:0 4px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}table.t th{text-align:left;font-size:11.5px;color:var(--mute);font-weight:600;border-bottom:1px solid var(--line);padding:6px 6px}
table.t td{border-bottom:1px solid #efece4;padding:7px 6px;vertical-align:top}table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}.kv div:nth-child(odd){color:var(--mute)}
.bigp{display:flex;gap:10px;margin:10px 0}.bigp>div{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.bigp b{display:block;font-size:20px}.bigp span{font-size:11.5px;color:var(--mute)}

.line.s-remembered,.line.s-suggested,.line.s-matched{border-left-color:var(--ok)}.line.s-check{border-left-color:#e3a008}.line.s-new{border-left-color:var(--new)}.line.s-skip{opacity:.6}
.line .lh{display:flex;gap:8px;align-items:flex-start}.line .lh .sn{font-weight:700;font-size:15px}
.alloc{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.pick{width:100%;text-align:left;border:1px solid #cfcab9;background:#fbfaf6;border-radius:9px;padding:9px 10px;cursor:pointer;min-height:40px}
.pick small{display:block;color:var(--mute);font-size:11.5px}
.prices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:8px}
@media(max-width:600px){.prices{grid-template-columns:repeat(3,minmax(0,1fr))}}
.prices .box{background:#f7f5ef;border-radius:8px;padding:6px 8px}.prices .box span{display:block;font-size:11px;color:var(--mute)}.prices .box b{font-size:14.5px}
.newbox{background:var(--newbg);border-radius:10px;padding:12px;margin-top:10px}
.foot{position:sticky;bottom:64px;z-index:15;background:var(--navy);color:var(--cream);border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center;margin-top:12px}
.foot .btn{white-space:nowrap}
@media(min-width:900px){.foot{bottom:10px}}
.foot .st{flex:1;font-size:12.5px;min-width:0;line-height:1.3}
.lsum{font-size:13px;color:var(--mute);margin-top:4px}.lsum b{color:var(--ink)}
@media(max-width:600px){.toast{bottom:auto!important;top:64px}}
.warnbox{background:var(--warnbg);color:#6b3f00;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13.5px}
.warnbox.bad{background:var(--badbg);color:var(--bad)}.okbox{background:var(--okbg);color:var(--ok);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13.5px}
.lock{max-width:340px;margin:8vh auto 0;text-align:center}.lock h1{color:var(--navy);letter-spacing:.12em;font-size:22px;margin:0}
.dots{display:flex;justify-content:center;gap:12px;margin:22px 0}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--navy)}.dots i.on{background:var(--navy)}
.nlist{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto;margin-top:12px}.nlist button{display:flex;flex-direction:column;align-items:flex-start;padding:12px 14px;border:1px solid #d6d2c6;border-radius:12px;background:#fff;cursor:pointer;text-align:left}
.nlist button b{font-size:16px}.nlist button span{font-size:12px;color:var(--mute)}.nlist button.own{background:var(--navy);color:#fff}.nlist button.own span{color:#cdd3e0}
#apbar{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:60;background:#B23B2E;color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer}
.codes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.codes b{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:20px;letter-spacing:.12em}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:18px;height:18px;margin-top:1px;flex:none}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pad button{height:58px;border-radius:14px;border:1px solid #d6d2c6;background:#fff;font-size:22px;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:80;background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--bad)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
.spin.dk{border-color:rgba(31,42,68,.2);border-top-color:var(--navy)}@keyframes sp{to{transform:rotate(360deg)}}
.busy{position:fixed;inset:0;z-index:90;background:rgba(244,242,236,.75);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-weight:600;color:var(--navy);text-align:center;padding:20px}
.busy .spin{width:34px;height:34px;border-width:3px}
.upl{border:2px dashed #c9c2ad;border-radius:14px;padding:22px;text-align:center;background:#fffdf7;cursor:pointer}
.upl b{display:block;font-size:16px;color:var(--navy)}
.hide{display:none!important}
.li{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid #efece4;cursor:pointer}.li:last-child{border:0}
.cnt{font-size:11px;color:var(--mute);float:right}
a{color:var(--new)}
</style>

<body>
<div id="app"></div>
<div id="modals"></div>
<script>
'use strict';
/* ───────────── state ───────────── */
const S = { pin: '', token: '', user: null, role: '', products: [], bySku: {}, stock: {}, locations: [], settings: {}, categories: [], view: 'search',
  filter: 'all', q: '', drafts: 0, gs1Pending: 0, at: null, inv: null, invWarn: [], stockLoc: 'All', stockQ: '' };
const LOC_SHORT = { 'Central Warehouse': 'CW', 'Gulshan One29 Mall': 'Gulshan', 'City Galleria – Gaur City-2': 'Galleria', 'Central Market – Sector 120': 'Sec 120' };
const $ = (s, el) => (el || document).querySelector(s), $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const x = Number(String(v == null ? '' : v).replace(/[₹,\s]/g, '')); return isFinite(x) ? x : 0; };
const r2 = x => Math.round(num(x) * 100) / 100, r3 = x => Math.round(num(x) * 1000) / 1000;
const inr = (x, d) => (x === '' || x == null || isNaN(x)) ? '–' : '₹' + Number(x).toLocaleString('en-IN', { maximumFractionDigits: d == null ? 2 : d, minimumFractionDigits: 0 });
const qfmt = x => Number(r3(x)).toLocaleString('en-IN', { maximumFractionDigits: 3 });
const unitOf = p => (p && p.unit) || 'kg';
const store = { get(k) { try { return localStorage.getItem('nvinv_' + k); } catch (e) { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem('nvinv_' + k) : localStorage.setItem('nvinv_' + k, v); } catch (e) { } } };
const ymd = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const today = () => ymd(new Date());
const isOwner = () => !!(S.user && S.user.role === 'Owner');
const can = k => !!(S.user && (S.user.role === 'Owner' || (S.user.rights || []).indexOf(k) >= 0));
const IN_APP = !!window.NV_APP;   // true in the installed app (camera + Bluetooth work), false inside Google's page

/* ───────────── server ───────────── */
function call(action, data) {
  const body = { token: S.token || '', pin: S.token ? '' : (S.pin || ''), action: action, data: data || {} };
  const fail = m => {
    if (/Signed out/.test(m) && ['hello', 'login', 'loginNames', 'logout'].indexOf(action) < 0) { S.token = ''; store.set('token', null); S.user = null; setTimeout(lockScreen, 0); }
    return new Error(m);
  };
  if (window.NV_API) {
    return fetch(window.NV_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(r => r.json(), () => { throw new Error('No internet connection – check Wi-Fi / mobile data and try again.'); })
      .then(j => { if (!j || !j.ok) throw fail((j && j.e) || 'Server error'); return j.r; });
  }
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(fail((e && e.message || String(e)).replace(/^Error:\s*/, '').replace(/^Exception:\s*/, '')))).api(body);
  });
}
let toastT;
function toast(msg, err) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); document.body.appendChild(t); }
  t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), err ? 6000 : 3000);
}
function busy(msg) { const b = document.createElement('div'); b.className = 'busy'; b.innerHTML = '<span class="spin dk"></span><div>' + esc(msg || 'Working…') + '</div>'; document.body.appendChild(b); return () => b.remove(); }
async function run(msg, fn) { const done = busy(msg); try { return await fn(); } catch (e) { toast(e.message, true); throw e; } finally { done(); } }

/* ───────────── lock / login ───────────── */
async function start() {
  S.token = store.get('token') || '';
  const oldPin = store.get('pin');
  try {
    if (!S.token && oldPin) {                         // owner signed in on this phone before personal PINs: switch to a session
      try { const r = await call('login', { name: 'Owner', pin: oldPin }); S.token = r.token; store.set('token', S.token); } catch (e) { }
      store.set('pin', null);
    }
    const h = await call('hello');
    if (h.needOwnerPin) return firstPin();
    if (h.user) { S.user = h.user; return h.user.mustChange ? forcePinChange() : boot(); }
    lockScreen();
  } catch (e) { $('#app').innerHTML = '<div class="lock"><h1>NUTVIQUE</h1><p class="warnbox bad">' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">Try again</button></div>'; }
}
function pinPad(title, sub, onDone, extra) {
  let v = '';
  $('#app').innerHTML = '<div class="lock"><h1>NUTVIQUE</h1><div class="mute small" style="letter-spacing:.2em">INVENTORY · BILLING</div><h3 style="margin-top:28px">' + esc(title) + '</h3><div class="mute small">' + esc(sub || '') + '</div>' +
    '<div class="dots" id="dots"></div><div class="pad">' + [1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, '✓'].map(k => '<button data-k="' + k + '">' + k + '</button>').join('') + '</div>' + (extra || '') + '</div>';
  const draw = () => { $('#dots').innerHTML = Array.from({ length: Math.max(4, v.length) }, (_, i) => '<i class="' + (i < v.length ? 'on' : '') + '"></i>').join(''); };
  draw();
  const press = k => { if (k === '⌫') v = v.slice(0, -1); else if (k === '✓') { if (v.length >= 4) { const x = v; v = ''; draw(); onDone(x); } return; } else if (v.length < 8) v += k; draw(); };
  $$('.pad button').forEach(b => b.onclick = () => press(b.dataset.k));
  document.onkeydown = e => { if (!$('.pad')) return; if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('⌫'); else if (e.key === 'Enter') press('✓'); };
}
/* Sign in: pick your name, then your own PIN. The phone remembers the last name. */
async function lockScreen(pickName) {
  document.onkeydown = null;
  const last = store.get('lastName');
  if (last && !pickName) return pinFor(last);
  $('#app').innerHTML = '<div class="lock"><h1>NUTVIQUE</h1><div class="mute small" style="letter-spacing:.2em">INVENTORY · BILLING</div><h3 style="margin-top:24px">Who is signing in?</h3><div id="names"><div class="empty"><span class="spin dk"></span></div></div></div>';
  let r; try { r = await call('loginNames'); } catch (e) { $('#names').innerHTML = '<div class="warnbox bad">' + esc(e.message) + '</div><button class="btn" onclick="lockScreen(true)">Try again</button>'; return; }
  const names = r.names.slice().sort((a, b) => a.name.localeCompare(b.name));
  $('#names').innerHTML = '<div class="nlist">' + names.map(n => '<button data-n="' + esc(n.name) + '"><b>' + esc(n.name) + '</b><span>' + esc(n.role + (n.home ? ' · ' + (LOC_SHORT[n.home] || n.home) : '')) + '</span></button>').join('') +
    (r.owner ? '<button data-n="Owner" class="own"><b>Owner</b><span>Head office</span></button>' : '') + '</div>' +
    '<div class="tiny mute" style="margin-top:12px">Your name is not here? Ask head office to add you.</div>';
  $$('#names [data-n]').forEach(b => b.onclick = () => pinFor(b.dataset.n));
}
function pinFor(name) {
  pinPad(name === 'Owner' ? 'Owner' : 'Hi ' + name.split(' ')[0], 'Enter your PIN', async pin => {
    try {
      const r = await run('Signing in…', () => call('login', { name: name, pin: pin }));
      S.token = r.token; S.user = r.user; store.set('token', S.token); store.set('lastName', name);
      if (r.user.mustChange) return forcePinChange(pin);
      boot();
    } catch (e) { pinFor(name); }
  }, '<button class="btn ghost sm" style="margin-top:16px" onclick="store.set(\'lastName\',null);lockScreen(true)">Not ' + esc(name.split(' ')[0]) + '? Pick your name</button>');
}
/* First sign-in with the PIN from head office: choose your own (only you know it). */
function forcePinChange(oldPin) {
  const ask = () => pinPad('Choose your own PIN', '4–6 digits that only you know. Head office cannot see it.', p1 => {
    pinPad('Type the new PIN again', '', async p2 => {
      if (p1 !== p2) { toast('The two PINs are different – try again', true); return ask(); }
      if (!oldPin) { return pinPad('PIN from head office', 'Enter the PIN head office gave you', async o => { oldPin = o; save(p1); }); }
      save(p1);
    });
  });
  const save = async p => {
    try { const r = await run('Saving your PIN…', () => call('changePin', { old: oldPin, pin: p })); S.user = r.user; toast('Your PIN is saved'); boot(); }
    catch (e) { if (/Current PIN is wrong/.test(e.message)) oldPin = ''; ask(); }
  };
  ask();
}
function firstPin() {
  pinPad('Create the owner PIN', '4–8 digits. You need it for costs, invoices and GS1.', async pin => {
    try { await call('setOwnerPin', { pin: pin }); const r = await call('login', { name: 'Owner', pin: pin }); S.token = r.token; S.user = r.user; store.set('token', S.token); store.set('lastName', 'Owner'); toast('Owner PIN saved'); boot(); }
    catch (e) { toast(e.message, true); }
  });
}

let pinging = false;

/* ───────────── stock helpers ───────────── */
const stockOf = sku => S.stock[sku] || { q: {}, t: 0 };
function locChips(sku) {
  const q = stockOf(sku).q;
  return Object.keys(q).filter(l => q[l]).map(l => '<span class="' + (q[l] < 0 ? 'neg' : '') + '">' + esc(LOC_SHORT[l] || l) + ' ' + qfmt(q[l]) + '</span>').join('');
}
function hay(p) { return (p.name + ' ' + p.seller + ' ' + p.sku + ' ' + p.gtin + ' ' + p.cat).toUpperCase(); }
function matchQ(p, q) {
  if (!q) return true;
  const h = hay(p);
  return q.toUpperCase().split(/\s+/).filter(Boolean).every(w => h.indexOf(w) >= 0);
}
function marginPct(cost, sell) { return cost && sell ? Math.round((sell - cost) / sell * 1000) / 10 : null; }

function fileToBase64(f) {
  return new Promise((res, rej) => {
    if (/^image\//.test(f.type) && !/gif|svg/.test(f.type)) {
      const img = new Image(), url = URL.createObjectURL(f);
      img.onload = () => {
        const k = Math.min(1, 2200 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); res({ base64: c.toDataURL('image/jpeg', 0.88).split(',')[1], mime: 'image/jpeg' });
      };
      img.onerror = () => rej(new Error('Could not open that photo.')); img.src = url;
    } else {
      if (f.size > 15 * 1024 * 1024) return rej(new Error('File is larger than 15 MB.'));
      const fr = new FileReader(); fr.onload = () => res({ base64: String(fr.result).split(',')[1], mime: f.type || 'application/pdf' }); fr.onerror = () => rej(new Error('Could not read the file.')); fr.readAsDataURL(f);
    }
  });
}
async function uploadInvoice(f) {
  try {
    const b = await fileToBase64(f);
    const r = await run('Reading the invoice… (15–40 seconds)', () => call('readInvoice', { fileName: f.name, mime: b.mime, base64: b.base64 }));
    S.inv = r.draft; S.invWarn = r.warnings || []; S.drafts++; renderNav();
    S.inv.lines.forEach(l => primeLine(l));
    drawReview(); toast('Invoice read – check each line');
  } catch (e) { if (!$('.toast.err')) toast(e.message, true); }
}
function addLine() { const d = S.inv; d.lines.push({ no: d.lines.length + 1, desc: '', hsn: '', qty: 0, unit: 'KGS', rate: 0, amount: 0, gstPct: 5, alloc: [], how: 'new', candidates: [], newItem: { name: 'Nutvique ', short: '', cat: '', pack: 'Loose', net: '', netUnit: 'g' } }); }
/** Fill selling/MRP of each allocation with the product's current prices, and suggested prices for new items. */
function primeLine(l) {
  (l.alloc || []).forEach(a => { const p = S.bySku[a.sku]; if (p) { if (a.sell == null) a.sell = p.sell || ''; if (a.mrp == null) a.mrp = p.mrp || ''; } });
}
/* landed cost: same formula as Code.gs → landed_() */
function landed(d) {
  const charges = (d.charges || []).reduce((a, c) => a + num(c.amount), 0);
  const byQty = S.settings.spread === 'Quantity', withGst = S.settings.costGst;
  const base = d.lines.reduce((a, l) => a + (byQty ? num(l.qty) : num(l.amount)), 0) || 1;
  return d.lines.map(l => { const share = charges * (byQty ? num(l.qty) : num(l.amount)) / base; return { share: share, total: num(l.amount) + share + (withGst ? num(l.amount) * num(l.gstPct) / 100 : 0) }; });
}
function suggestSell(cost) { const k = S.settings.round || 10; return cost ? Math.ceil(cost * S.settings.markup / k) * k : ''; }
function suggestMrp(sell) { return sell ? Math.round(num(sell) * S.settings.mrpX) : ''; }
function checks(d) {
  const w = (S.invWarn || []).filter(x => /DUPLICATE|NIGHT CLOSING/.test(x));
  const sumAmt = d.lines.reduce((a, l) => a + num(l.amount), 0), ch = (d.charges || []).reduce((a, c) => a + num(c.amount), 0);
  d.lines.forEach(l => { if (Math.abs(num(l.qty) * num(l.rate) - num(l.amount)) > Math.max(1, num(l.amount) * 0.002)) w.push('Line ' + l.no + ': qty × rate = ' + inr(num(l.qty) * num(l.rate)) + ' but amount is ' + inr(l.amount) + '.'); });
  if (num(d.taxable) && Math.abs(sumAmt - num(d.taxable)) > 1) w.push('Lines add up to ' + inr(sumAmt) + ' but the invoice taxable value is ' + inr(d.taxable) + '.');
  const calc = sumAmt + num(d.gst) + ch + num(d.roundOff);
  if (num(d.total) && Math.abs(calc - num(d.total)) > 1) w.push('Taxable + GST + charges + round off = ' + inr(calc) + ' but the invoice total is ' + inr(d.total) + '.');
  return w;
}

function reviewStatus(d, lc) {
  let qty = 0, value = 0, todo = 0, newCount = 0, lines = 0;
  d.lines.forEach((l, i) => {
    if (l.skip) return; lines++;
    value += lc[i].total; qty += num(l.qty);
    if (l.how === 'new') { if (l.create) newCount++; else todo++; }

    $$('#m_map select', m).forEach(s => s.onchange = prev); prev();
  }
  function findP(row) {
    const c = id => { const i = +$('#' + id, m).value; return i >= 0 ? String(row[i]).trim() : ''; };
    const b = c('c_b'), s = c('c_s').toUpperCase(), n = c('c_n');
    return S.products.find(p => b && p.gtin === b.replace(/\.0$/, '')) || S.products.find(p => s && p.sku === s) || S.products.find(p => n && p.name.toUpperCase() === n.toUpperCase()) ||
      S.products.find(p => n && p.name.toUpperCase().replace(/^NUTVIQUE\s+/, '') === n.toUpperCase().replace(/^NUTVIQUE\s+/, '')) || null;
  }
  function prev() {
    const qi = +$('#c_q', m).value, di = +$('#c_d', m).value;
    const out = table.rows.map(r => { const p = findP(r); let d = di >= 0 ? r[di] : ''; if (typeof d === 'number') d = ymd(new Date(Math.round((d - 25569) * 864e5))); else if (d) { const x = new Date(d); d = isNaN(x) ? '' : ymd(x); } return { r: r, p: p, qty: qi >= 0 ? num(r[qi]) : 0, date: d }; }).filter(x => x.qty);
    const ok = out.filter(x => x.p), miss = out.filter(x => !x.p);
    const agg = {}; ok.forEach(x => { const k = x.p.sku + '|' + (x.date || ''); agg[k] = agg[k] || { sku: x.p.sku, qty: 0, date: x.date }; agg[k].qty = r3(agg[k].qty + x.qty); });
    const lines = Object.values(agg);
    $('#m_prev', m).innerHTML = '<div class="' + (miss.length ? 'warnbox' : 'okbox') + '" style="margin-top:12px">' + ok.length + ' row(s) matched to ' + lines.length + ' product line(s)' + (miss.length ? ' · ' + miss.length + ' not matched (skipped): ' + esc(miss.slice(0, 6).map(x => x.r.join(' ').slice(0, 40)).join(' | ')) + (miss.length > 6 ? '…' : '') : '') + '</div>' +
      '<button class="btn block" id="m_go"' + (lines.length ? '' : ' disabled') + '>Import ' + lines.length + ' line(s)</button>';
    $('#m_go', m).onclick = async () => {
      const kind = $('#m_kind', m).value;
      const r = await run('Importing…', () => call('importMovements', { kind: kind, location: $('#m_loc', m).value, date: $('#m_date', m).value, file: fileName, lines: lines }));
      m.close(); await refresh(true); toast(r.rows + ' row(s) imported');
    };
  }
}

    'A barcode scanner gun also works in the Search box.</div></div>';
  if (can('settings')) h += '<div class="card" id="setc"><h3>Settings</h3><div class="empty"><span class="spin dk"></span></div></div>' +
    '<div class="card"><h3>Night Closing app</h3><div class="small mute">Stock movements from the Night Closing app are read live. Products and selling prices are pushed to its Products tab after every change.</div><button class="btn sm ghost" id="sy" style="margin-top:10px">Sync products to Night Closing now</button></div>';
  $('#view').innerHTML = h;
  $('#lo').onclick = signOut; $('#cpin').onclick = changePinSheet;
  if ($('#ppl')) $('#ppl').onclick = peopleScreen;
  if ($('#apv')) $('#apv').onclick = () => approvalsSheet(true);
  if ($('#apc')) $('#apc').onclick = codesSheet;
  if (!can('settings')) return;
  $('#sy').onclick = async () => { const r = await run('Syncing…', () => call('syncNc')); toast('Night Closing: ' + r.products); };
  const s = await call('getSettings');
  const f = (k, type) => fld(esc(k), '<input class="i" data-s="' + esc(k) + '" ' + (type || '') + ' value="' + esc(s[k]) + '">');
  $('#setc').innerHTML = '<h3>Settings</h3><div class="grid2">' +
    fld('Gemini API key (reads invoices) ' + (s.hasGeminiKey ? '<span class="pill p-ok">saved</span>' : '<span class="pill p-warn">missing</span>'), '<input class="i" id="gk" type="password" placeholder="' + (s.hasGeminiKey ? 'saved – paste a new one to replace' : 'paste key from aistudio.google.com/apikey') + '" autocomplete="off">', 2) +
    f('Markup (selling = cost ×)', 'inputmode="decimal"') + f('Round selling price up to', 'inputmode="decimal"') + f('MRP = selling ×', 'inputmode="decimal"') + f('Minimum margin %', 'inputmode="decimal"') +
    fld('Cost includes GST', '<select class="i" data-s="Cost includes GST"><option' + (s['Cost includes GST'] !== 'Yes' ? ' selected' : '') + '>No</option><option' + (s['Cost includes GST'] === 'Yes' ? ' selected' : '') + '>Yes</option></select>') +
    fld('Spread charges by', '<select class="i" data-s="Spread charges by"><option' + (s['Spread charges by'] !== 'Quantity' ? ' selected' : '') + '>Value</option><option' + (s['Spread charges by'] === 'Quantity' ? ' selected' : '') + '>Quantity</option></select>') +
    f('Gemini model') + f('Last GTIN used on DataKart') + '</div><button class="btn" id="ss" style="margin-top:12px">Save settings</button>' +
    '<h3 style="margin-top:18px">Upload templates (once)</h3><div class="small mute">Pick the blank GS1_DATAKART_PRODUCT_LIST.xlsx and QUEBUSTER_PRODUCTS_MASTER.xlsx from your NUTVIQUE PRODUCT SYSTEM folder.</div>' +
    '<div class="grid2" style="margin-top:8px">' + fld('DataKart template ' + (s.gs1Template ? '<span class="pill p-ok">uploaded</span>' : ''), '<input class="i" type="file" accept=".xlsx" id="t_g">') + fld('QueueBuster template ' + (s.qbTemplate ? '<span class="pill p-ok">uploaded</span>' : ''), '<input class="i" type="file" accept=".xlsx" id="t_q">') + '</div>' +
    '<div class="small" style="margin-top:12px"><a href="' + esc(s.sheetUrl) + '" target="_blank">Open the Inventory Google Sheet</a></div>';
  $('#ss').onclick = async () => {
    const d = {}; $$('[data-s]').forEach(el => d[el.dataset.s] = el.value); if ($('#gk').value.trim()) d.geminiKey = $('#gk').value.trim();
    const r = await run('Saving…', () => call('saveSettings', d));
    await refresh(true); toast('Settings saved' + (r.hasGeminiKey ? '' : ' (no Gemini key yet)')); viewMore();
  };
  const up = kind => async e => { const file = e.target.files[0]; if (!file) return; const b = await fileToBase64(file);
    await run('Uploading template…', () => call('saveTemplate', { kind: kind, fileName: file.name, base64: b.base64 })); toast('Template saved'); viewMore(); };
  $('#t_g').onchange = up('gs1'); $('#t_q').onchange = up('qb');
}

start();
</script>
</body>
</html>
