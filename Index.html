<body>
<div id="app"></div>
<div id="modals"></div>
<script>
'use strict';
/* ───────────── state ───────────── */
const S = { pin: '', token: '', user: null, role: '', products: [], bySku: {}, stock: {}, locations: [], settings: {}, categories: [], view: 'search',
  filter: 'all', q: '', drafts: 0, gs1Pending: 0, at: null, inv: null, invWarn: [], stockLoc: 'All', stockQ: '' };
const LOC_SHORT = { 'Central Warehouse': 'CW', 'Gulshan One29 Mall': 'Gulshan', 'City Galleria – Gaur City-2': 'Galleria', 'Central Market – Sector 120': 'Sec 120' };
const $ = (s, el) => (el || document).querySelector(s), $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const x = Number(String(v == null ? '' : v).replace(/[₹,\s]/g, '')); return isFinite(x) ? x : 0; };
const r2 = x => Math.round(num(x) * 100) / 100, r3 = x => Math.round(num(x) * 1000) / 1000;
const inr = (x, d) => (x === '' || x == null || isNaN(x)) ? '–' : '₹' + Number(x).toLocaleString('en-IN', { maximumFractionDigits: d == null ? 2 : d, minimumFractionDigits: 0 });
const qfmt = x => Number(r3(x)).toLocaleString('en-IN', { maximumFractionDigits: 3 });
const unitOf = p => (p && p.unit) || 'kg';
const store = { get(k) { try { return localStorage.getItem('nvinv_' + k); } catch (e) { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem('nvinv_' + k) : localStorage.setItem('nvinv_' + k, v); } catch (e) { } } };
const ymd = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const today = () => ymd(new Date());
const isOwner = () => !!(S.user && S.user.role === 'Owner');
const can = k => !!(S.user && (S.user.role === 'Owner' || (S.user.rights || []).indexOf(k) >= 0));
const canApprove = () => !!(S.user && (S.user.role === 'Owner' || S.user.role === 'Manager' || (S.user.rights || []).indexOf('approve') >= 0));
const IN_APP = !!window.NV_APP;   // true in the installed app (camera + Bluetooth work), false inside Google's page

/* ───────────── server ───────────── */
function call(action, data) {
  const body = { token: S.token || '', pin: S.token ? '' : (S.pin || ''), action: action, data: data || {} };
  const fail = m => {
    if (/Signed out/.test(m) && ['hello', 'login', 'loginNames', 'logout'].indexOf(action) < 0) { S.token = ''; store.set('token', null); store.set('cache', null); S.user = null; setTimeout(lockScreen, 0); }
    return new Error(m);
  };
  if (window.NV_API) {
    const post = () => fetch(window.NV_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(r => r.json());
    return post().catch(() => new Promise(r => setTimeout(r, 1500)).then(post))           // one quiet retry for a network blip
      .catch(() => { throw new Error('No internet connection – check Wi-Fi / mobile data and try again.'); })
      .then(j => { if (!j || !j.ok) throw fail((j && j.e) || 'Server error'); return j.r; });
  }
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(fail((e && e.message || String(e)).replace(/^Error:\s*/, '').replace(/^Exception:\s*/, '')))).api(body);
  });
}
let toastT;
function toast(msg, err) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); document.body.appendChild(t); }
  t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), err ? 6000 : 3000);
}
function busy(msg) { const b = document.createElement('div'); b.className = 'busy'; b.innerHTML = '<span class="spin dk"></span><div>' + esc(msg || 'Working…') + '</div>'; document.body.appendChild(b); return () => b.remove(); }
async function run(msg, fn) { const done = busy(msg); try { return await fn(); } catch (e) { toast(e.message, true); throw e; } finally { done(); } }

/* ───────────── lock / login ───────────── */
async function start() {
  S.token = store.get('token') || '';
  const oldPin = store.get('pin');
  try {
    if (!S.token && oldPin) {                         // owner signed in on this phone before personal PINs: switch to a session
      try { const r = await call('login', { name: 'Owner', pin: oldPin }); S.token = r.token; store.set('token', S.token); } catch (e) { }
      store.set('pin', null);
    }
    if (S.token) {                                     // signed in on this phone: show the last data at once, refresh in one call
      const c = appCache();
      if (c) { S.user = c.user; applyBoot(c.boot); useBillBoot(c.bill); shell(); }
      else $('#app').innerHTML = '<div class="empty" style="margin-top:30vh"><span class="spin dk"></span><div style="margin-top:10px">Loading products and stock…</div></div>';
      let r;
      try { r = await call('start', { loc: (typeof B !== 'undefined' && B.loc) || store.get('bloc') || '' }); }
      catch (e) { if (!S.token) return; if (c) { toast(e.message, true); return; } throw e; }
      return startDone(r, !!c);
    }
    lockScreen();                                      // sign-in screen at once; first-ever set-up (no owner PIN yet) is checked alongside
    call('hello').then(h => { if (h.needOwnerPin) firstPin(); }).catch(() => { });
  } catch (e) { $('#app').innerHTML = '<div class="lock"><h1>NUTVIQUE</h1><p class="warnbox bad">' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">Try again</button></div>'; }
}
function pinPad(title, sub, onDone, extra) {
  let v = '';
  $('#app').innerHTML = '<div class="lock"><h1>NUTVIQUE</h1><div class="mute small" style="letter-spacing:.2em">INVENTORY · BILLING</div><h3 style="margin-top:28px">' + esc(title) + '</h3><div class="mute small">' + esc(sub || '') + '</div>' +

function fileToBase64(f) {
  return new Promise((res, rej) => {
    if (/^image\//.test(f.type) && !/gif|svg/.test(f.type)) {
      const img = new Image(), url = URL.createObjectURL(f);
      img.onload = () => {
        const k = Math.min(1, 2200 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); res({ base64: c.toDataURL('image/jpeg', 0.88).split(',')[1], mime: 'image/jpeg' });
      };
      img.onerror = () => rej(new Error('Could not open that photo.')); img.src = url;
    } else {
      if (f.size > 15 * 1024 * 1024) return rej(new Error('File is larger than 15 MB.'));
      const fr = new FileReader(); fr.onload = () => res({ base64: String(fr.result).split(',')[1], mime: f.type || 'application/pdf' }); fr.onerror = () => rej(new Error('Could not read the file.')); fr.readAsDataURL(f);
    }
  });
}
async function uploadInvoice(f) {

    S.inv = r.draft; S.invWarn = r.warnings || []; S.drafts++; renderNav();

function addLine() { const d = S.inv; d.lines.push({ no: d.lines.length + 1, desc: '', hsn: '', qty: 0, unit: 'KGS', rate: 0, amount: 0, gstPct: 5, alloc: [], how: 'new', candidates: [], newItem: { name: 'Nutvique ', short: '', cat: '', pack: 'Loose', net: '', netUnit: 'g' } }); }
/** Fill selling/MRP of each allocation with the product's current prices, and suggested prices for new items. */
function primeLine(l) {
  (l.alloc || []).forEach(a => { const p = S.bySku[a.sku]; if (p) { if (a.sell == null) a.sell = p.sell || ''; if (a.mrp == null) a.mrp = p.mrp || ''; } });
}
/* landed cost: same formula as Code.gs → landed_() */
function landed(d) {
  const charges = (d.charges || []).reduce((a, c) => a + num(c.amount), 0);
  const byQty = S.settings.spread === 'Quantity', withGst = S.settings.costGst;
  const base = d.lines.reduce((a, l) => a + (byQty ? num(l.qty) : num(l.amount)), 0) || 1;
  return d.lines.map(l => { const share = charges * (byQty ? num(l.qty) : num(l.amount)) / base; return { share: share, total: num(l.amount) + share + (withGst ? num(l.amount) * num(l.gstPct) / 100 : 0) }; });
}
function suggestSell(cost) { const k = S.settings.round || 10; return cost ? Math.ceil(cost * S.settings.markup / k) * k : ''; }
function suggestMrp(sell) { return sell ? Math.round(num(sell) * S.settings.mrpX) : ''; }
function checks(d) {
  const w = (S.invWarn || []).filter(x => /DUPLICATE|NIGHT CLOSING/.test(x));
  const sumAmt = d.lines.reduce((a, l) => a + num(l.amount), 0), ch = (d.charges || []).reduce((a, c) => a + num(c.amount), 0);
  d.lines.forEach(l => { if (Math.abs(num(l.qty) * num(l.rate) - num(l.amount)) > Math.max(1, num(l.amount) * 0.002)) w.push('Line ' + l.no + ': qty × rate = ' + inr(num(l.qty) * num(l.rate)) + ' but amount is ' + inr(l.amount) + '.'); });
  if (num(d.taxable) && Math.abs(sumAmt - num(d.taxable)) > 1) w.push('Lines add up to ' + inr(sumAmt) + ' but the invoice taxable value is ' + inr(d.taxable) + '.');
  const calc = sumAmt + num(d.gst) + ch + num(d.roundOff);
  if (num(d.total) && Math.abs(calc - num(d.total)) > 1) w.push('Taxable + GST + charges + round off = ' + inr(calc) + ' but the invoice total is ' + inr(d.total) + '.');
  return w;
}

function loadXlsx() { return window.XLSX ? Promise.resolve() : new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = () => rej(new Error('Could not load the spreadsheet reader.')); document.head.appendChild(s); }); }
function importSheet() {
  const m = modal('Import sales export / stock count file', '<div class="grid2">' + fld('File type', '<select class="i" id="m_kind"><option value="sale">Sales export (QueueBuster) – stock goes out</option><option value="count">Stock count sheet – set quantities</option></select>', 2) +

    try { await loadXlsx(); const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' }); const ws = wb.Sheets[wb.SheetNames[0]]; const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
      const hi = aoa.findIndex(r => r.filter(x => String(x).trim()).length >= 2); table = { head: aoa[hi].map(String), rows: aoa.slice(hi + 1).filter(r => r.some(x => String(x).trim())) }; drawMap(); }

  };
  const guess = (re) => table.head.findIndex(h => re.test(h));
  function drawMap() {
    const opts = sel => '<option value="-1">–</option>' + table.head.map((h, i) => '<option value="' + i + '"' + (i === sel ? ' selected' : '') + '>' + esc(h) + '</option>').join('');
    const gb = guess(/barcode|gtin|ean/i), gs = guess(/^sku|item code|product code/i), gn = guess(/product name|item name|^product$|^item$|name/i), gq = guess(/qty|quantity|sold|count/i), gd = guess(/date/i);

    $$('#m_map select', m).forEach(s => s.onchange = prev); prev();

  function findP(row) {

    const b = c('c_b'), s = c('c_s').toUpperCase(), n = c('c_n');
    return S.products.find(p => b && p.gtin === b.replace(/\.0$/, '')) || S.products.find(p => s && p.sku === s) || S.products.find(p => n && p.name.toUpperCase() === n.toUpperCase()) ||
      S.products.find(p => n && p.name.toUpperCase().replace(/^NUTVIQUE\s+/, '') === n.toUpperCase().replace(/^NUTVIQUE\s+/, '')) || null;
  }
  function prev() {

    const ok = out.filter(x => x.p), miss = out.filter(x => !x.p);

/* ───────────── DISCOUNT APPROVALS (owner / approvers) ───────────── */
let apOpen = false;
async function checkApprovals() {
  if (!canApprove()) return;
  let r; try { r = await call('approvalList'); } catch (e) { return; }
  S.apPending = r.pending;
  let bar = $('#apbar');
  const acc = r.access || [], cash = r.cash || [], n = r.pending.length + acc.length + cash.length;
  if (!n) { if (bar) bar.remove(); return; }
  if (!bar) { bar = document.createElement('div'); bar.id = 'apbar'; document.body.appendChild(bar); }
  const a = r.pending[0], x = acc[0], c = cash[0];
  bar.onclick = () => (!a && !x && c) ? cashPickupsSheet('waiting') : approvalsSheet();
  bar.innerHTML = (a ? '<b>Discount approval needed</b> ' + esc(a.by) + ' · ' + a.pct + '% (₹' + money(a.disc) + ' off ₹' + money(a.gross) + ')' : x ? '<b>Store access today</b> ' + esc(x.by) + ' → ' + esc(LOC_SHORT[x.loc] || x.loc)
    : '<b>💰 Confirm cash</b> ₹' + money(c.amount).replace(/\.00$/, '') + ' taken by ' + esc(c.by) + ' · ' + esc(LOC_SHORT[c.loc] || c.loc)) + (n > 1 ? ' + ' + (n - 1) + ' more' : '') + ' <u>Review</u>';
  const fresh = r.pending.length + acc.length > 0, newCash = cash.some(k => !(S.kpSeen || {})[k.id]);
  S.kpSeen = S.kpSeen || {}; cash.forEach(k => S.kpSeen[k.id] = 1);
  if ((fresh || newCash) && navigator.vibrate) try { navigator.vibrate([120, 60, 120]); } catch (e) { }
  if (!apOpen && !$('.modal')) { if (fresh) approvalsSheet(); else if (newCash) cashPickupsSheet('waiting'); }
}

  const hm = x => new Date(x).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  const draw = r => {
    $('#up_b', m).innerHTML = (r.error ? '<div class="warnbox bad">Could not read the bank emails: ' + esc(r.error) + '</div>' : '') +
      '<div class="bigp"><div><span>Payments</span><b>' + r.list.length + '</b></div><div><span>Total</span><b>' + inr(r.total, 0) + '</b></div><div><span>Not linked to a bill</span><b>' + r.unmatched + '</b></div></div>' +

        (x.bill ? '<b>' + esc(x.bill) + '</b><div class="tiny mute">' + esc(x.by) + '</div><button class="btn sm ghost" data-ux="' + esc(x.id) + '">Unlink</button>' : x.status !== 'Unmatched' ? '<span class="small">' + esc(x.status) + '</span>' : '<span class="pill p-warn">Not linked</span><div class="row" style="margin-top:4px;flex-wrap:nowrap"><input class="i" style="min-width:0;width:120px" placeholder="Bill no." data-ub="' + esc(x.id) + '"><button class="btn sm" data-ul="' + esc(x.id) + '">Link</button></div><button class="btn sm ghost" data-uo="' + esc(x.id) + '">Not a bill</button>') + '</td></tr>').join('') + '</table></div>'
        : '<div class="empty small">No ICICI payment emails on this day.</div>') +
      '<div class="tiny mute" style="margin-top:8px">Reads emails in nutzyfoods@gmail.com matching: ' + esc(r.query) + ' (Settings tab "UPI email search").</div>';
    $$('[data-ul]', m).forEach(b => b.onclick = async () => { const no = $('[data-ub="' + b.dataset.ul + '"]', m).value.trim(); if (!no) return toast('Type the bill no.', true); const x = await run('Linking…', () => call('upiMatch', { id: b.dataset.ul, bill: no })).catch(() => null); if (x) draw(x); });
    $$('[data-ux]', m).forEach(b => b.onclick = async e => { if (!confirmTwice(e.target)) return; const x = await run('Unlinking…', () => call('upiMatch', { id: b.dataset.ux, bill: '' })).catch(() => null); if (x) draw(x); });
    $$('[data-uo]', m).forEach(b => b.onclick = async () => { const why = prompt('What was this payment for? (e.g. QueueBuster bill, advance, refund)'); if (!why) return; const x = await run('Saving…', () => call('upiMatch', { id: b.dataset.uo, bill: '', other: why })).catch(() => null); if (x) draw(x); });
  };
  const load = async () => { $('#up_b', m).innerHTML = '<div class="empty"><span class="spin dk"></span></div>'; try { draw(await call('upiList', { date: $('#up_d', m).value })); } catch (e) { $('#up_b', m).innerHTML = '<div class="warnbox bad">' + esc(e.message) + '</div>'; } };
  $('#up_d', m).onchange = load; $('#up_r', m).onclick = load; load();

  };

const isOwnerUi = () => !!(S.user && S.user.role === 'Owner');
/** Owner: loyalty coupon for one or many customers – % / minimum bill / validity decided here (v18.20). */
function couponForm(list, done) {
  const one = list.length === 1;
  const m = modal('🎁 Loyalty coupon', '<div class="small">' + (one ? 'For <b>' + esc(list[0].name || 'customer') + '</b> · ' + esc(list[0].phone) : 'For <b>' + list.length + ' customers</b> (the list you filtered) – each gets their own code.') + '</div>' +
    '<div class="grid3" style="margin-top:10px"><div><label class="f">Coupon %</label><input class="i num" id="gc_p" inputmode="decimal" placeholder="e.g. 10"></div>' +
    '<div><label class="f">Min bill ₹</label><input class="i num" id="gc_m" inputmode="decimal" placeholder="0 = any"></div>' +
    '<div><label class="f">Valid days</label><input class="i num" id="gc_d" inputmode="numeric" value="30"></div></div>' +
    '<label class="f" style="margin-top:8px">Note (optional, e.g. Diwali thank-you)</label><input class="i" id="gc_n" maxlength="80">' +
    '<div class="tiny mute" style="margin-top:6px">Works at any store and event on the customer\'s mobile number, one per bill, not with other discounts. Up to 50%.</div>' +
    '<button class="btn gold block" id="gc_go" style="margin-top:12px">Create ' + (one ? 'coupon' : list.length + ' coupons') + '</button><div id="gc_out"></div>');
  $('#gc_go', m).onclick = async e => {
    const pct = num($('#gc_p', m).value);
    if (!(pct >= 1 && pct <= 50)) return toast('Type the coupon % (1 to 50)', true);
    if (!one && !confirmTwice(e.target)) return;
    const r = await run('Creating coupons…', () => call('giveCoupons', { keys: list.map(x => x.key), pct: pct, min: num($('#gc_m', m).value), days: num($('#gc_d', m).value) || 30, note: $('#gc_n', m).value })).catch(() => null);
    if (!r) return;
    const brand = ((typeof B !== 'undefined' && B.boot && B.boot.setup) || {})['Brand name'] || 'Nutvique';
    const msg = c => 'Hi' + (c.name ? ' ' + c.name : '') + '! Thank you for being a loyal ' + brand + ' customer. Here is your *' + c.pct + '% coupon: ' + c.code + '*' + ($('#gc_n', m).value ? ' (' + $('#gc_n', m).value + ')' : '') + '.\n\nUse it ' + (c.min ? 'on a purchase of ₹' + c.min + ' or more ' : '') + 'at any ' + brand + ' store, valid till ' + c.till.split('-').reverse().join('-') + '. Just tell us your mobile number at billing.';
    $('#gc_go', m).remove();
    $('#gc_out', m).innerHTML = '<div class="okbox" style="margin-top:10px">✓ ' + r.given.length + ' coupon' + (r.given.length === 1 ? '' : 's') + ' created – ' + pct + '% off, valid till ' + (r.given[0] ? r.given[0].till.split('-').reverse().join('-') : '') + '.</div>' +
      '<div class="small" style="margin:8px 0">Send each one on WhatsApp (opens WhatsApp Business with the message ready):</div>' +
      r.given.map(c => '<div class="row" style="flex-wrap:nowrap;padding:6px 0;border-bottom:1px solid var(--line)"><div class="grow small"><b>' + esc(c.code) + '</b> · ' + esc(c.name || 'Customer') + ' · ' + esc(c.phone.slice(0, 2) + '••••' + c.phone.slice(-4)) + '</div><a class="btn sm wa" target="_blank" rel="noopener" href="' + esc(waUrl(c.phone, msg(c))) + '">WhatsApp</a></div>').join('');
    if (done) done();
  };
}

  };
  $('#cu_go', m).onclick = () => load($('#cu_q', m).value.trim());
  $('#cu_q', m).onkeydown = e => { if (e.key === 'Enter') load(e.target.value.trim()); };
  load('');
}

/* ───────────── MORE ───────────── */
async function storePriceSheet(loc) {
  const r = await run('Loading…', () => call('storePrices')), list = r[loc] || [];
  const m = modal('Store-only prices – ' + loc, '<div class="tscroll"><table class="t"><tr><th>Product</th><th class="n">Normal</th><th class="n">Here</th><th class="n">MRP here</th><th></th></tr>' +
    list.map(x => '<tr><td>' + esc(x.name.replace(/^Nutvique\s+/, '')) + '</td><td class="n">' + inr(x.baseSell, 0) + '</td><td class="n"><b>' + inr(x.sell, 0) + '</b></td><td class="n">' + inr(x.mrp, 0) + '</td><td><button class="btn sm ghost" data-spx="' + esc(x.sku) + '">×</button></td></tr>').join('') + '</table></div>' +
    '<button class="btn ghost block" id="spclr" style="margin-top:12px">Remove all store-only prices here</button>', { wide: true });
  $$('[data-spx]', m).forEach(b => b.onclick = async e => { if (!confirmTwice(e.target)) return; await run('Removing…', () => call('clearStorePrices', { location: loc, sku: b.dataset.spx })); await refresh(true); m.close(); storePriceSheet(loc); });
  $('#spclr', m).onclick = async e => { if (!confirmTwice(e.target)) return; await run('Removing…', () => call('clearStorePrices', { location: loc })); await refresh(true); m.close(); viewMore(); };
}
async function viewMore() {
  const u = S.user || {};
  const rl = u.role === 'Owner' ? 'everything' : (u.rights || []).length + ' right' + ((u.rights || []).length === 1 ? '' : 's');
  let h = '<h2>More</h2><div class="card"><div class="kv"><div>Signed in as</div><div><b>' + esc(u.name || '') + '</b> · ' + esc(u.role || '') + ' (' + rl + ')</div>' +
    (u.home ? '<div>Home store</div><div>' + esc(u.home) + '</div>' : '') + '<div>Products</div><div>' + S.products.length + '</div><div>Last refresh</div><div>' + (S.at ? new Date(S.at).toLocaleString('en-IN') : '') + '</div></div>' +
    '<div class="row" style="margin-top:12px"><button class="btn sm ghost" id="cpin">Change my PIN</button><button class="btn sm ghost" id="lo">Sign out / switch person</button></div></div>';
  if (can('people')) h += '<div class="card"><h3>People, PINs and rights</h3><div class="small mute">Add employees, give each a PIN, choose Manager / Staff and tick exactly what each person may do.</div><button class="btn sm" id="ppl" style="margin-top:10px">Open People</button></div>';
  if (can('prices')) { const sp = S.storePrices || {}, ls = Object.keys(sp).filter(l => Object.keys(sp[l]).length);
    h += '<div class="card"><h3>Store-only prices</h3><div class="small mute">New prices that apply at one store before the others. Bills at that store use them; other stores keep the normal price.</div>' +
      (ls.length ? ls.map(l => '<div class="row" style="margin-top:10px"><div class="grow"><b>' + esc(l) + '</b> · ' + Object.keys(sp[l]).length + ' items</div><button class="btn sm ghost" data-spv="' + esc(l) + '">View</button><button class="btn sm gold" data-spa="' + esc(l) + '">Apply to all stores</button></div>').join('') : '<div class="small" style="margin-top:8px">None at the moment.</div>') + '</div>'; }
  if (can('customers')) h += '<div class="card"><h3>Customers</h3><div class="small mute">All customers with mobile and name, bills sent on WhatsApp, pending coupons, referrals. Download to Excel.</div><button class="btn sm" id="cust" style="margin-top:10px">Open</button></div>';
  if (isOwnerUi() || can('prices')) h += '<div class="card"><h3>🎁 Hamper recipes</h3><div class="small mute">What goes into each gift hamper (box, jars, grams of each product) – taken out of stock on every hamper sale.</div><button class="btn sm" id="hrl" style="margin-top:10px">Open</button></div>';
  if (S.user && (S.user.role === 'Owner' || S.user.role === 'Manager')) h += '<div class="card"><h3>🏢 Corporate orders (Tally)</h3><div class="small mute">Upload the Tally invoice PDF – the sale goes into the Sales report and the items (and hamper contents) come out of stock.</div><button class="btn sm" id="col" style="margin-top:10px">Open</button></div>';
  if (can('sales') || isOwnerUi()) h += '<div class="card"><h3>🏦 Bank tally – UPI &amp; card</h3><div class="small mute">Next day: UPI and card sold against what ICICI and Paytm paid into the bank (read from the ICICI emails).</div><button class="btn sm" id="btl" style="margin-top:10px">Open</button></div>';
  if (can('sales') || isOwnerUi()) h += '<div class="card"><h3>💰 Cash pickups</h3><div class="small mute">Every time cash is taken from a store drawer – who took it, how much, and whether the owner has confirmed receiving it.</div><button class="btn sm" id="kpl" style="margin-top:10px">Open</button></div>';
  if (can('sales')) h += '<div class="card"><h3>UPI payments (bank emails)</h3><div class="small mute">Every payment ICICI emails about, and the bill it belongs to. Payments not linked to a bill are flagged.</div><button class="btn sm" id="upil" style="margin-top:10px">Open</button></div>';
  if (canApprove() && !can('approve')) h += '<div class="card"><h3>Store access requests</h3><div class="small mute">Staff covering a shift at another store ask here for one day.</div><button class="btn sm" id="apv" style="margin-top:10px">Requests</button></div>';
  if (can('approve')) h += '<div class="card"><h3>Discount approvals</h3><div class="small mute">Discount requests from staff and managers appear on your screen within seconds while the app is open. One-time codes are a back-up you can read out on the phone (each works once, up to 25%).</div>' +
    '<div class="row" style="margin-top:10px"><button class="btn sm" id="apv">Requests</button><button class="btn sm ghost" id="apc">One-time codes</button></div></div>';
  h += '<div class="card"><h3>Use it like an app</h3><div class="small">' + (IN_APP ? 'You are in the installed Nutvique app. ' : 'For the camera scanner and the Bluetooth scale, install the app: open <b>vermakshat.com/nutvique</b> in Chrome (Android) or Safari (iPhone) → Install / Add to Home Screen. ') +
    'A barcode scanner gun also works in the Search box.</div></div>';
  if (can('settings')) h += '<div class="card" id="setc"><h3>Settings</h3><div class="empty"><span class="spin dk"></span></div></div>' +
    '<div class="card"><h3>Night Closing app</h3><div class="small mute">Stock movements from the Night Closing app are read live. Products and selling prices are pushed to its Products tab after every change.</div><button class="btn sm ghost" id="sy" style="margin-top:10px">Sync products to Night Closing now</button></div>';
  $('#view').innerHTML = h;
  $('#lo').onclick = signOut; $('#cpin').onclick = changePinSheet;
  if ($('#ppl')) $('#ppl').onclick = peopleScreen;
  if ($('#cust')) $('#cust').onclick = customersScreen;
  $$('[data-spv]').forEach(b => b.onclick = () => storePriceSheet(b.dataset.spv));
  $$('[data-spa]').forEach(b => b.onclick = e => {
    const l = b.dataset.spa, n = Object.keys((S.storePrices || {})[l] || {}).length;
    const m = modal('Apply ' + (LOC_SHORT[l] || l) + ' prices to all stores', '<div class="small">The ' + n + ' store-only prices of <b>' + esc(l) + '</b> become the normal price at every store (Products, price history, QueueBuster update list and Night Closing).</div><button class="btn gold block" id="spgo" style="margin-top:12px">Apply to all stores</button>');
    $('#spgo', m).onclick = async () => { m.close(); const r = await run('Applying prices…', () => call('applyStorePrices', { location: l })); await refresh(true); toast(r.applied + ' prices now apply at every store'); viewMore(); };
  });
  if ($('#apv')) $('#apv').onclick = () => approvalsSheet(true);
  if ($('#upil')) $('#upil').onclick = () => upiSheet();
  if ($('#btl')) $('#btl').onclick = () => bankTallySheet();
  if ($('#hrl')) $('#hrl').onclick = () => hamperRecipesSheet();
  if ($('#col')) $('#col').onclick = () => corpScreen();
  if ($('#kpl')) $('#kpl').onclick = () => cashPickupsSheet(isOwnerUi() ? 'waiting' : 'all');
  if ($('#apc')) $('#apc').onclick = codesSheet;
  if (!can('settings')) return;
  $('#sy').onclick = async () => { const r = await run('Syncing…', () => call('syncNc')); toast('Night Closing: ' + r.products); };
  const s = await call('getSettings');
  const f = (k, type) => fld(esc(k), '<input class="i" data-s="' + esc(k) + '" ' + (type || '') + ' value="' + esc(s[k]) + '">');
  $('#setc').innerHTML = '<h3>Settings</h3><div class="grid2">' +
    fld('Gemini API key (reads invoices) ' + (s.hasGeminiKey ? '<span class="pill p-ok">saved</span>' : '<span class="pill p-warn">missing</span>'), '<input class="i" id="gk" type="password" placeholder="' + (s.hasGeminiKey ? 'saved – paste a new one to replace' : 'paste key from aistudio.google.com/apikey') + '" autocomplete="off">', 2) +
    f('Markup (selling = cost ×)', 'inputmode="decimal"') + f('Round selling price up to', 'inputmode="decimal"') + f('MRP = selling ×', 'inputmode="decimal"') + f('Minimum margin %', 'inputmode="decimal"') +
    fld('Cost includes GST', '<select class="i" data-s="Cost includes GST"><option' + (s['Cost includes GST'] !== 'Yes' ? ' selected' : '') + '>No</option><option' + (s['Cost includes GST'] === 'Yes' ? ' selected' : '') + '>Yes</option></select>') +
    fld('Spread charges by', '<select class="i" data-s="Spread charges by"><option' + (s['Spread charges by'] !== 'Quantity' ? ' selected' : '') + '>Value</option><option' + (s['Spread charges by'] === 'Quantity' ? ' selected' : '') + '>Quantity</option></select>') +
    f('Gemini model') + f('Last GTIN used on DataKart') + '</div>' +
    '<h3 style="margin-top:18px">Customers → Google Contacts</h3><div class="grid2">' + fld('Google Contacts: save customers', '<select class="i" data-s="Google Contacts: save customers">' + ["Owner's bills only", 'All bills', 'Off'].map(o => '<option' + ((s['Google Contacts: save customers'] || "Owner's bills only") === o ? ' selected' : '') + '>' + o + '</option>').join('') + '</select>') + '</div><div class="tiny mute">New customers are saved to the Google Contacts of nutzyfoods@gmail.com (label “Nutvique customers”). They show on any phone where that account syncs contacts.</div>' +
    '<h3 style="margin-top:18px">UPI payment check (ICICI SMS / email)</h3><div class="grid2">' + fld('UPI email check', '<select class="i" data-s="UPI email check"><option' + (s['UPI email check'] !== 'On' ? ' selected' : '') + '>Off</option><option' + (s['UPI email check'] === 'On' ? ' selected' : '') + '>On</option></select>') + f('UPI email search', 'placeholder="from:(icici.bank.in) newer_than:2d"') + '</div><div class="tiny mute">On = the UPI QR screen waits for ICICI\'s credit SMS (forwarded by the owner\'s iPhone) and shows “✓ received”. Email search “off” = SMS only.</div>' +
    '<h3 style="margin-top:18px">Store closing emails</h3><div class="grid2">' + f('Day close emails: also send to', 'placeholder="a@x.com, b@y.com"') + f('Card terminals (ID = store)', 'placeholder="EP292213=Central Market – Sector 120"') + '</div><div class="tiny mute">Every Day close goes by email to the owner email, every manager who has an email in People, and these addresses (comma-separated).</div>' +
    '<h3 style="margin-top:18px">Discounts</h3><div class="grid2">' + f('Discount: round off without approval up to ₹', 'inputmode="decimal" placeholder="20"') + '</div><div class="tiny mute">Anyone who bills can take this much off a bill (e.g. ₹1,312.50 → ₹1,300) without asking. Above it, staff need approval; managers can give up to 10% alone. 0 = always ask.</div>' +
    '<h3 style="margin-top:18px">🍀 Lucky draw (store bills)</h3><div class="grid2">' + f('Lucky draw: bill of at least ₹', 'inputmode="decimal" placeholder="1000"') + f('Lucky draw: chance of 10% coupon (out of 100)', 'inputmode="decimal" placeholder="25 – the rest get 5%"') +
    f('Lucky draw: coupon valid (days)', 'inputmode="numeric" placeholder="30"') + f('Lucky draw: coupon needs bill of ₹', 'inputmode="decimal" placeholder="1000"') + '</div>' +
    '<h3 style="margin-top:18px">Referral coupons</h3><div class="grid2">' + f("Referral: friend's bill at least ₹", 'inputmode="decimal" placeholder="1000"') + f('Referral: coupon %', 'inputmode="decimal" placeholder="10"') +
    f('Referral: coupon needs bill of ₹', 'inputmode="decimal" placeholder="1000"') + f('Referral: coupon valid (months)', 'inputmode="numeric" placeholder="1"') + '</div>' +
    '<button class="btn" id="ss" style="margin-top:12px">Save settings</button>' +
    '<h3 style="margin-top:18px">Upload templates (once)</h3><div class="small mute">Pick the blank GS1_DATAKART_PRODUCT_LIST.xlsx and QUEBUSTER_PRODUCTS_MASTER.xlsx from your NUTVIQUE PRODUCT SYSTEM folder.</div>' +
    '<div class="grid2" style="margin-top:8px">' + fld('DataKart template ' + (s.gs1Template ? '<span class="pill p-ok">uploaded</span>' : ''), '<input class="i" type="file" accept=".xlsx" id="t_g">') + fld('QueueBuster template ' + (s.qbTemplate ? '<span class="pill p-ok">uploaded</span>' : ''), '<input class="i" type="file" accept=".xlsx" id="t_q">') + '</div>' +
    '<div class="small" style="margin-top:12px"><a href="' + esc(s.sheetUrl) + '" target="_blank">Open the Inventory Google Sheet</a></div>';
  $('#ss').onclick = async () => {
    const d = {}; $$('[data-s]').forEach(el => d[el.dataset.s] = el.value); if ($('#gk').value.trim()) d.geminiKey = $('#gk').value.trim();
    const r = await run('Saving…', () => call('saveSettings', d));
    await refresh(true); toast('Settings saved' + (r.hasGeminiKey ? '' : ' (no Gemini key yet)')); viewMore();
  };
  const up = kind => async e => { const file = e.target.files[0]; if (!file) return; const b = await fileToBase64(file);
    await run('Uploading template…', () => call('saveTemplate', { kind: kind, fileName: file.name, base64: b.base64 })); toast('Template saved'); viewMore(); };
  $('#t_g').onchange = up('gs1'); $('#t_q').onchange = up('qb');
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else setTimeout(start, 0);
</script>
